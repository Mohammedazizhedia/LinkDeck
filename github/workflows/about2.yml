name: About v2

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version + BFB signature
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys
          def patch(path, old, new, label):
              p = pathlib.Path(path); t = p.read_text(encoding="utf-8")
              if new in t: print("skip:", label); return
              if old not in t: print("ANCHOR MISSING:", label); sys.exit(1)
              p.write_text(t.replace(old, new, 1), encoding="utf-8"); print("patched:", label)

          g = pathlib.Path("app/build.gradle.kts")
          t = g.read_text(encoding="utf-8")
          if 'versionName = "0.3.0"' not in t and 'versionName = "0.1.0-phase1"' in t:
              g.write_text(t.replace('versionCode = 1\n        versionName = "0.1.0-phase1"', 'versionCode = 3\n        versionName = "0.3.0"'), encoding="utf-8")
              print("patched: gradle version")

          LINE = '            Text("LinkDeck v" + com.linkdeck.app.BuildConfig.VERSION_NAME + "  |  Built For Benefits, by AI - BFB.AI", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.primary)\n'
          patch("app/src/main/java/com/linkdeck/app/ui/settings/SettingsScreen.kt",
                '            OutlinedButton(\n                onClick = {\n                    vm.settings.resetToDefaults()',
                LINE + '            OutlinedButton(\n                onClick = {\n                    vm.settings.resetToDefaults()',
                "BFB signature")
          print("ALL OK")
          PYEOF
      - name: Commit and push
        run: |
          git config user.name "Mohammedazizhedia"
          git config user.email "mohammedazizhedia@gmail.com"
          git add -A
          git commit -m "Version + BFB signature"
          git push
