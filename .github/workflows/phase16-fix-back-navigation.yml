name: Phase 16 - Fix Back Navigation & Add Open Button

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.13.0'
      build_number:
        description: 'Build number'
        required: true
        default: '017'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Fix Back Navigation in AppNavHost
        run: |
          python3 << 'PYTHON'
          import re

          file_path = "app/src/main/java/com/linkdeck/app/AppNavHost.kt"
          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()

          # 1. Add BackHandler import if not present
          if 'import androidx.activity.compose.BackHandler' not in content:
              content = content.replace(
                  'import androidx.compose.material3.Text',
                  'import androidx.compose.material3.Text\nimport androidx.activity.compose.BackHandler'
              )

          # 2. Fix HOME route to disable back button (prevent app exit)
          old_home = 'composable(Routes.HOME) { HomeRouter(navController) }'
          new_home = '''composable(Routes.HOME) {
              // Disable back button on HOME to prevent app exit
              BackHandler(enabled = true) {
                  // Do nothing - prevent going back
              }
              HomeRouter(navController)
          }'''
          content = content.replace(old_home, new_home)

          # 3. Fix all sub-screens to always pop to HOME (not exit app)
          # Replace all instances of onBack = { navController.popBackStack() }
          # with onBack = { navController.popBackStack(Routes.HOME, false) }
          content = content.replace(
              'onBack = { navController.popBackStack() }',
              'onBack = { navController.popBackStack(Routes.HOME, false) }'
          )

          with open(file_path, 'w', encoding='utf-8') as f:
              f.write(content)
          
          print("✅ Back navigation fixed:")
          print("  - HOME screen: Back button disabled (won't exit app)")
          print("  - Sub-screens: Always return to HOME (not exit)")
          PYTHON

      - name: Build app
        run: |
          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew clean assembleDebug
          else
              gradle clean assembleDebug
          fi

      - name: Package with clear naming
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          
          ZIP_NAME="LinkDeck_v${V}_build${B}_${D}.zip"
          APK_NAME="LinkDeck_v${V}_b${B}.apk"
          
          mkdir -p out
          RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          
          if [ -z "$RAW_APK" ]; then
              echo "❌ No APK found!"
              exit 1
          fi
          
          cp "$RAW_APK" "out/$APK_NAME"
          
          cat > out/README.txt << EOF
          ═══════════════════════════════════════════════════
          LinkDeck v${V} (Build #${B})
          Built: ${D}
          ═══════════════════════════════════════════════════
          
          📲 INSTALLATION:
          1. Tap on ${APK_NAME} to install
          2. Android will update the old version automatically
          3. After installation, tap "Open" to launch
          
          ⚠️ If "Open" button doesn't appear:
          - Some Android launchers don't show it
          - Just open LinkDeck from your app drawer
          
          🔧 WHAT'S FIXED:
          - Back button no longer exits the app
          - Sub-screens always return to HOME
          ═══════════════════════════════════════════════════
          EOF
          
          cd out && zip -r "../$ZIP_NAME" . && cd ..
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: "LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})"
          body: |
            ## 🔙 Phase 16 - Back Navigation Fixed
            
            **Built with BFB.AI - Built For Benefits, by AI**
            
            ### 🐛 What's Fixed
            - ✅ **Back button no longer exits the app** from HOME screen
            - ✅ **Sub-screens always return to HOME** (not exit app)
            - ✅ Clear APK naming: `${{ env.APK_NAME }}`
            
            ### 📲 Installation
            1. Download and extract the ZIP
            2. Tap `${{ env.APK_NAME }}` to install
            3. Android will update the old version
            4. Tap "Open" or launch from app drawer
            
            **Note:** If "Open" button doesn't appear after installation, 
            just open LinkDeck from your app drawer. This depends on your 
            Android launcher, not the app itself.
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
