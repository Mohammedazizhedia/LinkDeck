name: Phase 8 - Enhanced Pairing Screen

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.7.0'
      build_number:
        description: 'Build number'
        required: true
        default: '008'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Create Enhanced Pairing Screen
        run: |
          mkdir -p app/src/main/java/com/linkdeck/app/ui/pairing
          cat > app/src/main/java/com/linkdeck/app/ui/pairing/EnhancedPairingScreen.kt << 'KT'
          package com.linkdeck.app.ui.pairing

          import androidx.compose.animation.core.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.QrCodeScanner
          import androidx.compose.material.icons.filled.Wifi
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          @Composable
          fun EnhancedPairingScreen(
              isScanning: Boolean = false,
              onScanQR: () -> Unit,
              onShowQR: () -> Unit,
              onBack: () -> Unit
          ) {
              val infiniteTransition = rememberInfiniteTransition(label = "scan")
              val pulseScale by infiniteTransition.animateFloat(
                  initialValue = 1f,
                  targetValue = 1.1f,
                  animationSpec = infiniteRepeatable(
                      animation = tween(1500, easing = CubicBezierEasing(0.37f, 0f, 0.63f, 1f)),
                      repeatMode = RepeatMode.Reverse
                  ),
                  label = "pulse"
              )

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF0E0B1F))
                      .padding(32.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  // Animated Scanning Orb
                  Box(modifier = Modifier.size(180.dp), contentAlignment = Alignment.Center) {
                      Box(
                          modifier = Modifier
                              .size(180.dp)
                              .scale(if (isScanning) pulseScale else 1f)
                              .border(2.dp, Color(0xFF5B4BD6), CircleShape)
                      )
                      Box(
                          modifier = Modifier
                              .size(140.dp)
                              .border(1.dp, Color(0xFF2B2650), CircleShape)
                      )
                      Box(
                          modifier = Modifier
                              .size(100.dp)
                              .background(Color(0xFF5B4BD6), CircleShape),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(
                              imageVector = if (isScanning) Icons.Default.Wifi else Icons.Default.QrCodeScanner,
                              contentDescription = null,
                              tint = Color.White,
                              modifier = Modifier.size(48.dp)
                          )
                      }
                  }

                  Spacer(modifier = Modifier.height(48.dp))

                  // Status Text
                  Text(
                      text = if (isScanning) "جاري البحث عن الأجهزة..." else "جاهز للاتصال",
                      color = Color(0xFFEDEBFF),
                      fontSize = 24.sp,
                      fontWeight = FontWeight.Bold,
                      textAlign = TextAlign.Center
                  )

                  Spacer(modifier = Modifier.height(16.dp))

                  Text(
                      text = if (isScanning) "تأكد من أن الجهازين على نفس شبكة Wi-Fi" else "اختر طريقة الاتصال",
                      color = Color(0xFFA9A4CF),
                      fontSize = 16.sp,
                      textAlign = TextAlign.Center,
                      modifier = Modifier.padding(horizontal = 16.dp)
                  )

                  Spacer(modifier = Modifier.height(48.dp))

                  // Action Buttons
                  Button(
                      onClick = onScanQR,
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(60.dp),
                      shape = RoundedCornerShape(16.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF5B4BD6)),
                      enabled = !isScanning
                  ) {
                      Icon(Icons.Default.QrCodeScanner, contentDescription = null, modifier = Modifier.size(24.dp))
                      Spacer(modifier = Modifier.width(12.dp))
                      Text("مسح QR Code", fontSize = 18.sp, fontWeight = FontWeight.SemiBold)
                  }

                  Spacer(modifier = Modifier.height(16.dp))

                  OutlinedButton(
                      onClick = onShowQR,
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(60.dp),
                      shape = RoundedCornerShape(16.dp),
                      colors = ButtonDefaults.outlinedButtonColors(contentColor = Color(0xFFB9AFFF)),
                      border = androidx.compose.foundation.BorderStroke(1.5.dp, Color(0xFF2B2650)),
                      enabled = !isScanning
                  ) {
                      Icon(Icons.Default.Wifi, contentDescription = null, modifier = Modifier.size(24.dp))
                      Spacer(modifier = Modifier.width(12.dp))
                      Text("عرض QR Code", fontSize = 18.sp, fontWeight = FontWeight.SemiBold)
                  }

                  Spacer(modifier = Modifier.height(24.dp))

                  TextButton(onClick = onBack) {
                      Text("العودة", color = Color(0xFFA9A4CF), fontSize = 16.sp)
                  }
              }
          }
          KT
          echo "✅ EnhancedPairingScreen.kt created"

      - name: Build app
        run: |
          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew :app:assembleDebug
          else
              gradle :app:assembleDebug
          fi

      - name: Package ZIP
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          ZIP="LinkDeck_v${V}_build${B}_${D}.zip"
          mkdir -p out
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && echo "❌ No APK!" && exit 1
          cp "$APK" out/LinkDeck.apk
          echo "Built with BFB.AI - Phase 8: Enhanced Pairing" > out/BFB.txt
          cd out && zip -r "../$ZIP" . && cd ..
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: "LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})"
          body: |
            ## 🔗 Phase 8 - Enhanced Pairing Screen
            **Built with BFB.AI - Built For Benefits, by AI**
            
            ### What's New
            - ✅ New enhanced pairing screen with animated scanning orb
            - ✅ Clear status messages (Scanning / Ready)
            - ✅ Modern button design with icons
            - ✅ Consistent with the new dark theme
            
            *(This is a new component ready for integration)*
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
