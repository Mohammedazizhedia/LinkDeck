name: One Shot P2P Fix

on:
  workflow_dispatch:

jobs:
  fix-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Apply P2P Fixes
        run: |
          python3 - <<'PYEOF'
          import pathlib

          # 1. إصلاح PairingManager
          pm = pathlib.Path("app/src/main/java/com/linkdeck/app/pairing/PairingManager.kt")
          if pm.exists():
              text = pm.read_text()
              if "hostAutoP2p" not in text:
                  block = """
    private val _p2pCode = MutableStateFlow<String?>(null)
    val p2pCode: StateFlow<String?> = _p2pCode

    fun hostAutoP2p() {
        if (_p2pCode.value != null) return
        val p2p = P2pManager(context)
        p2p.startDiscovery()
        p2p.createGroup()
        scope.launch {
            p2p.connectionInfo.collect { info ->
                if (info?.isGroupOwner == true && _p2pCode.value == null) {
                    _p2pCode.value = hostStartP2p()
                }
            }
        }
    }

    fun startDiscovery()"""
                  text = text.replace("    fun startDiscovery()", block, 1)
                  pm.write_text(text)
                  print("✅ PairingManager: تمت إضافة الدوال")
              else:
                  print("ℹ️ PairingManager: الدوال موجودة بالفعل")

          # 2. إصلاح الواجهة
          ui = pathlib.Path("app/src/main/java/com/linkdeck/app/ui/home/HostHomeScreen.kt")
          if ui.exists():
              text = ui.read_text()
              
              # إصلاح الـ import
              text = text.replace("import com.linkdeck.core.network.PairingManager", "import com.linkdeck.app.pairing.PairingManager")
              
              if "p2pCode" not in text:
                  # البحث عن زرار QR وإضافة الزرار الجديد بعده
                  old_qr = """Button(onClick = {
                vm.pairingManager.hostStart()
                onShowQr()
            }) { Text(stringResource(R.string.show_qr)) }"""
            
            new_ui = old_qr + """
            
            Spacer(Modifier.height(Spacing.sm))
            val p2pCode by vm.pairingManager.p2pCode.collectAsState()
            if (p2pCode != null) {
                Text(
                    text = "كود Wi-Fi Direct: $p2pCode",
                    style = MaterialTheme.typography.titleLarge,
                    color = LinkDeckTheme.tints.accentFg,
                    modifier = Modifier.padding(vertical = Spacing.md)
                )
            }
            OutlinedButton(onClick = { vm.pairingManager.hostAutoP2p() }) { 
                Text("تشغيل Wi-Fi Direct") 
            }"""
            
            if old_qr in text:
                text = text.replace(old_qr, new_ui, 1)
                ui.write_text(text)
                print("✅ HostHomeScreen: تمت إضافة الزرار")
            else:
                print("❌ HostHomeScreen: مش لاقي زرار الـ QR الأصلي")
          else:
              print("ℹ️ HostHomeScreen: الزرار موجود بالفعل")
          PYEOF

      - name: Commit Changes
        run: |
          git config user.name "Mohammedazizhedia"
          git config user.email "mohammedazizhedia@gmail.com"
          git add -A
          git commit -m "One Shot Fix: P2P Logic + UI" || echo "No changes"
          git push
