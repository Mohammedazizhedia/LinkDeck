name: Phase 12 - Final Navigation Fix (With Correct Imports)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.9.3'
      build_number:
        description: 'Build number'
        required: true
        default: '013'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Apply navigation fix with correct imports
        run: |
          FILE="app/src/main/java/com/linkdeck/app/AppNavHost.kt"
          
          python3 << 'PYTHON'
          import re

          file_path = "app/src/main/java/com/linkdeck/app/AppNavHost.kt"

          with open(file_path, 'r', encoding='utf-8') as f:
              lines = f.readlines()

          # 1. Ensure CircularProgressIndicator import is present
          import_added = False
          for i, line in enumerate(lines):
              if 'import androidx.compose.material3.Text' in line:
                  if 'import androidx.compose.material3.CircularProgressIndicator' not in ''.join(lines):
                      lines.insert(i + 1, 'import androidx.compose.material3.CircularProgressIndicator\n')
                      import_added = True
                  break

          content = ''.join(lines)

          # 2. Replace the dead ModeSelectionScreen with a loading indicator
          old_pattern = r'null\s*->\s*ModeSelectionScreen\(onModeChosen\s*=\s*\{\}\)'
          new_code = 'null -> Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { CircularProgressIndicator() }'

          if re.search(old_pattern, content):
              content = re.sub(old_pattern, new_code, content)
              with open(file_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print("✅ Successfully replaced null state handler and added missing import")
          else:
              print("⚠️ Pattern not found, checking if already fixed...")
              if 'CircularProgressIndicator' in content:
                  print("✅ Already fixed!")
              else:
                  print("❌ Could not find pattern to replace")
          PYTHON
          
          echo "📄 Verification of the fix:"
          grep -B 1 -A 1 "null ->" "$FILE" || echo "Pattern not found"

      - name: Build app
        run: |
          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew clean :app:assembleDebug
          else
              gradle clean :app:assembleDebug
          fi

      - name: Package ZIP
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          ZIP="LinkDeck_v${V}_build${B}_${D}.zip"
          mkdir -p out
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && echo "❌ No APK!" && exit 1
          cp "$APK" out/LinkDeck.apk
          echo "Built with BFB.AI - Phase 12: Final Navigation Fix" > out/BFB.txt
          cd out && zip -r "../$ZIP" . && cd ..
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: "LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})"
          body: |
            ## 🎯 Phase 12 - FINAL Navigation Fix
            **Built with BFB.AI - Built For Benefits, by AI**
            
            ### What's Fixed
            - ✅ Added missing `CircularProgressIndicator` import
            - ✅ Replaced dead `ModeSelectionScreen(onModeChosen = {})` with a proper loading indicator
            - ✅ App now correctly waits for mode to save and navigates to Host/Controller screen
            
            **Buttons will now work perfectly!**
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
