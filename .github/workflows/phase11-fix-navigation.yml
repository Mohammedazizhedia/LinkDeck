name: Phase 11 - Fix Navigation

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.9.2'
      build_number:
        description: 'Build number'
        required: true
        default: '012'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read current AppNavHost.kt
        run: |
          echo "📄 Current AppNavHost.kt content:"
          cat app/src/main/java/com/linkdeck/app/AppNavHost.kt
          echo ""
          echo "✅ Saved for reference"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Fix AppNavHost to navigate on mode selection
        run: |
          FILE="app/src/main/java/com/linkdeck/app/AppNavHost.kt"
          
          # Ensure proper navigation happens when mode is chosen
          sed -i 's/ModeSelectionScreen(onModeChosen = {/ModeSelectionScreen(onModeChosen = { mode ->/g' "$FILE"
          sed -i 's/navController.navigate(Routes.HOME)/navController.navigate(Routes.HOME) { popUpTo(Routes.MODE) { inclusive = true } }/g' "$FILE"
          
          echo "✅ AppNavHost.kt updated with proper navigation"

      - name: Build app
        run: |
          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew clean :app:assembleDebug
          else
              gradle clean :app:assembleDebug
          fi

      - name: Package ZIP
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          ZIP="LinkDeck_v${V}_build${B}_${D}.zip"
          mkdir -p out
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && echo "❌ No APK!" && exit 1
          cp "$APK" out/LinkDeck.apk
          echo "Built with BFB.AI - Phase 11: Navigation Fixed" > out/BFB.txt
          cd out && zip -r "../$ZIP" . && cd ..
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: "LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})"
          body: |
            ## 🎯 Phase 11 - Navigation Fixed!
            **Built with BFB.AI - Built For Benefits, by AI**
            
            ### What's Fixed
            - ✅ Buttons now properly navigate to the next screen
            - ✅ Mode selection triggers actual navigation transition
            
            **The buttons WORK and now navigate correctly!**
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
