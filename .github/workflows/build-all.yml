name: Fix Fonts & Build LinkDeck

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      build_number:
        description: 'Build number (e.g., 001)'
        required: true
        default: '001'

jobs:
  fix-fonts-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Move fonts to correct location
        run: |
          # Create font directory
          mkdir -p core-design/src/main/res/font
          
          # Move all font files from root to font directory
          for font in cairo_variable.ttf readexpro_variable.ttf anton_regular.ttf montserrat_variable.ttf montserrat_italic_variable.ttf roboto_variable.ttf roboto_italic_variable.ttf; do
            if [ -f "$font" ]; then
              mv "$font" core-design/src/main/res/font/
              echo "✅ Moved: $font"
            fi
          done
          
          # List fonts in correct location
          echo "Fonts in correct location:"
          ls -la core-design/src/main/res/font/
      
      - name: Create Type.kt with variable fonts
        run: |
          cat > core-design/src/main/java/com/linkdeck/core/design/theme/Type.kt << 'KOTLIN_EOF'
          // Built with BFB.AI — Built For Benefits, by AI
          package com.linkdeck.core.design.theme
          
          import androidx.compose.material3.Typography
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.Font
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontVariation
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp
          import com.linkdeck.core.design.R
          
          // Cairo Variable Font (للعناوين)
          val Cairo = FontFamily(
              Font(
                  resId = R.font.cairo_variable,
                  weight = FontWeight.Normal,
                  variationSettings = FontVariation.Settings(FontVariation.weight(400))
              ),
              Font(
                  resId = R.font.cairo_variable,
                  weight = FontWeight.SemiBold,
                  variationSettings = FontVariation.Settings(FontVariation.weight(600))
              ),
              Font(
                  resId = R.font.cairo_variable,
                  weight = FontWeight.Bold,
                  variationSettings = FontVariation.Settings(FontVariation.weight(700))
              ),
              Font(
                  resId = R.font.cairo_variable,
                  weight = FontWeight.ExtraBold,
                  variationSettings = FontVariation.Settings(FontVariation.weight(800))
              )
          )
          
          // Readex Pro Variable Font (للنصوص)
          val ReadexPro = FontFamily(
              Font(
                  resId = R.font.readexpro_variable,
                  weight = FontWeight.Light,
                  variationSettings = FontVariation.Settings(FontVariation.weight(300))
              ),
              Font(
                  resId = R.font.readexpro_variable,
                  weight = FontWeight.Normal,
                  variationSettings = FontVariation.Settings(FontVariation.weight(400))
              ),
              Font(
                  resId = R.font.readexpro_variable,
                  weight = FontWeight.Medium,
                  variationSettings = FontVariation.Settings(FontVariation.weight(500))
              ),
              Font(
                  resId = R.font.readexpro_variable,
                  weight = FontWeight.SemiBold,
                  variationSettings = FontVariation.Settings(FontVariation.weight(600))
              )
          )
          
          // Montserrat Variable Font (اختياري - للعناوين اللاتينية)
          val Montserrat = FontFamily(
              Font(
                  resId = R.font.montserrat_variable,
                  weight = FontWeight.Normal,
                  variationSettings = FontVariation.Settings(FontVariation.weight(400))
              ),
              Font(
                  resId = R.font.montserrat_variable,
                  weight = FontWeight.Bold,
                  variationSettings = FontVariation.Settings(FontVariation.weight(700))
              )
          )
          
          val LinkDeckTypography = Typography(
              displayLarge = TextStyle(fontFamily = Cairo, fontWeight = FontWeight.ExtraBold, fontSize = 34.sp, lineHeight = 40.sp),
              headlineLarge = TextStyle(fontFamily = Cairo, fontWeight = FontWeight.Bold, fontSize = 26.sp, lineHeight = 32.sp),
              headlineMedium = TextStyle(fontFamily = Cairo, fontWeight = FontWeight.Bold, fontSize = 20.sp, lineHeight = 26.sp),
              titleLarge = TextStyle(fontFamily = Cairo, fontWeight = FontWeight.Bold, fontSize = 18.sp, lineHeight = 24.sp),
              titleMedium = TextStyle(fontFamily = ReadexPro, fontWeight = FontWeight.Medium, fontSize = 15.sp, lineHeight = 22.sp),
              bodyLarge = TextStyle(fontFamily = ReadexPro, fontWeight = FontWeight.Normal, fontSize = 15.sp, lineHeight = 22.sp),
              bodyMedium = TextStyle(fontFamily = ReadexPro, fontWeight = FontWeight.Normal, fontSize = 13.sp, lineHeight = 20.sp),
              bodySmall = TextStyle(fontFamily = ReadexPro, fontWeight = FontWeight.Light, fontSize = 12.sp, lineHeight = 18.sp),
              labelLarge = TextStyle(fontFamily = ReadexPro, fontWeight = FontWeight.Medium, fontSize = 13.sp, lineHeight = 18.sp),
              labelMedium = TextStyle(fontFamily = ReadexPro, fontWeight = FontWeight.Medium, fontSize = 12.sp, lineHeight = 16.sp),
              labelSmall = TextStyle(fontFamily = ReadexPro, fontWeight = FontWeight.Medium, fontSize = 11.sp, lineHeight = 14.sp)
          )
          KOTLIN_EOF
          
          echo "✅ Created Type.kt with variable fonts support"
      
      - name: Commit font fixes
        run: |
          git config user.name "Mohammedazizhedia"
          git config user.email "mohammedazizhedia@gmail.com"
          git add -A
          git commit -m "Fix: Move fonts to correct location and create Type.kt" || echo "No changes to commit"
          git push
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission
        run: chmod +x gradlew
      
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug
      
      - name: Set version variables
        id: vars
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BUILD="${{ github.event.inputs.build_number }}"
          DATE=$(date +%Y%m%d)
          ZIP_NAME="LinkDeck_v${VERSION}_build${BUILD}_${DATE}.zip"
          APK_PATH=$(find app/build/outputs -name "*.apk" | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
      
      - name: Create BFB.txt
        run: |
          cat > BFB.txt << 'EOF'
          ═══════════════════════════════════════════════════════════════════
          BFB.AI
          Built For Benefits, by AI
          ═══════════════════════════════════════════════════════════════════
          
          Name:    LinkDeck
          Version: ${{ steps.vars.outputs.version }}
          Build:   #${{ steps.vars.outputs.build }}
          Date:    ${{ steps.vars.outputs.date }}
          
          Google Services Mode: A (Open - No GMS)
          Typography: Cairo (Headings) + Readex Pro (Body)
          Languages: Arabic (RTL) + English (LTR)
          
          ═══════════════════════════════════════════════════════════════════
          Built with BFB.AI — Built For Benefits, by AI
          ═══════════════════════════════════════════════════════════════════
          EOF
      
      - name: Create ZIP package
        run: |
          ZIP_NAME="${{ steps.vars.outputs.zip_name }}"
          APK_PATH="${{ steps.vars.outputs.apk_path }}"
          
          # Create organized folder
          mkdir -p LinkDeck_Release
          cp "$APK_PATH" LinkDeck_Release/LinkDeck.apk
          cp BFB.txt LinkDeck_Release/
          cp README.md LinkDeck_Release/ 2>/dev/null || true
          
          # Create ZIP
          cd LinkDeck_Release
          zip -r "../$ZIP_NAME" .
          cd ..
          
          # Calculate SHA256
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"
          
          echo "✅ Created: $ZIP_NAME"
          echo "📦 SHA256: $(cat ${ZIP_NAME}.sha256)"
      
      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.zip_name }}
          path: |
            ${{ steps.vars.outputs.zip_name }}
            ${{ steps.vars.outputs.zip_name }}.sha256
          retention-days: 90
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.vars.outputs.version }}-build${{ steps.vars.outputs.build }}
          name: "LinkDeck v${{ steps.vars.outputs.version }} (Build #${{ steps.vars.outputs.build }})"
          body: |
            ## 🎉 LinkDeck v${{ steps.vars.outputs.version }}
            
            **Built with BFB.AI — Built For Benefits, by AI**
            
            ### 📦 What's Included
            - ✅ LinkDeck APK
            - ✅ BFB.txt (version info)
            - ✅ README.md
            - ✅ SHA256 checksum
            
            ### 🔐 Security
            - No Google Play Services (100% offline)
            - TLS 1.3 with certificate pinning
            
            ### 📋 SHA256
            ```
            $(cat ${{ steps.vars.outputs.zip_name }}.sha256)
            ```
            
            ---
            **Built with BFB.AI · Built For Benefits, by AI**
          files: |
            ${{ steps.vars.outputs.zip_name }}
            ${{ steps.vars.outputs.zip_name }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
