name: Build & Release LinkDeck

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      build_number:
        description: 'Build number (e.g., 001)'
        required: true
        default: '001'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission
        run: chmod +x gradlew
      
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug
      
      - name: Set version variables
        id: vars
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BUILD="${{ github.event.inputs.build_number }}"
          DATE=$(date +%Y%m%d)
          ZIP_NAME="LinkDeck_v${VERSION}_build${BUILD}_${DATE}.zip"
          APK_PATH=$(find app/build/outputs -name "*.apk" | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
      
      - name: Create BFB.txt
        run: |
          cat > BFB.txt << 'EOF'
          ═══════════════════════════════════════════════════════════════════
          BFB.AI
          Built For Benefits, by AI
          ═══════════════════════════════════════════════════════════════════
          
          Name:    LinkDeck
          Version: ${{ steps.vars.outputs.version }}
          Build:   #${{ steps.vars.outputs.build }}
          Date:    ${{ steps.vars.outputs.date }}
          
          Google Services Mode: A (Open - No GMS)
          Typography: Cairo (Headings) + Readex Pro (Body)
          Languages: Arabic (RTL) + English (LTR)
          
          ═══════════════════════════════════════════════════════════════════
          Built with BFB.AI — Built For Benefits, by AI
          ═══════════════════════════════════════════════════════════════════
          EOF
      
      - name: Create ZIP package
        run: |
          ZIP_NAME="${{ steps.vars.outputs.zip_name }}"
          APK_PATH="${{ steps.vars.outputs.apk_path }}"
          
          # Create organized folder
          mkdir -p LinkDeck_Release
          cp "$APK_PATH" LinkDeck_Release/LinkDeck.apk
          cp BFB.txt LinkDeck_Release/
          cp README.md LinkDeck_Release/ 2>/dev/null || true
          
          # Create ZIP
          cd LinkDeck_Release
          zip -r "../$ZIP_NAME" .
          cd ..
          
          # Calculate SHA256
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"
          
          echo "✅ Created: $ZIP_NAME"
          echo "📦 SHA256: $(cat ${ZIP_NAME}.sha256)"
      
      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.zip_name }}
          path: |
            ${{ steps.vars.outputs.zip_name }}
            ${{ steps.vars.outputs.zip_name }}.sha256
          retention-days: 90
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.vars.outputs.version }}-build${{ steps.vars.outputs.build }}
          name: "LinkDeck v${{ steps.vars.outputs.version }} (Build #${{ steps.vars.outputs.build }})"
          body: |
            ## 🎉 LinkDeck v${{ steps.vars.outputs.version }}
            
            **Built with BFB.AI — Built For Benefits, by AI**
            
            ### 📦 What's Included
            - ✅ LinkDeck APK
            - ✅ BFB.txt (version info)
            - ✅ README.md
            - ✅ SHA256 checksum
            
            ### 🔐 Security
            - No Google Play Services (100% offline)
            - TLS 1.3 with certificate pinning
            
            ### 📋 SHA256
            ```
            $(cat ${{ steps.vars.outputs.zip_name }}.sha256)
            ```
            
            ---
            **Built with BFB.AI · Built For Benefits, by AI**
          files: |
            ${{ steps.vars.outputs.zip_name }}
            ${{ steps.vars.outputs.zip_name }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
