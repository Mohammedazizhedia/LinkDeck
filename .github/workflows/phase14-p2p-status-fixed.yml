name: Phase 14 - Add P2P Status Indicator (Fixed Imports)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.11.0'
      build_number:
        description: 'Build number'
        required: true
        default: '015'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Create P2P Status Indicator Component
        run: |
          mkdir -p app/src/main/java/com/linkdeck/app/ui/components
          cat > app/src/main/java/com/linkdeck/app/ui/components/P2pStatusIndicator.kt << 'KT'
          package com.linkdeck.app.ui.components

          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          enum class P2pState {
              DISCONNECTED, SEARCHING, CONNECTED
          }

          @Composable
          fun P2pStatusIndicator(state: P2pState, peerName: String? = null) {
              val (bgColor, textColor, statusText) = when (state) {
                  P2pState.DISCONNECTED -> Color(0xFF3A1212) to Color(0xFFF87171) to "غير متصل"
                  P2pState.SEARCHING -> Color(0xFF3A2A10) to Color(0xFFFBBF24) to "جاري البحث..."
                  P2pState.CONNECTED -> Color(0xFF12322E) to Color(0xFF5EEAD4) to "متصل"
              }

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(12.dp))
                      .background(bgColor)
                      .padding(horizontal = 16.dp, vertical = 10.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.SpaceBetween
              ) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Box(
                          modifier = Modifier
                              .size(10.dp)
                              .clip(RoundedCornerShape(50))
                              .background(textColor)
                      )
                      Spacer(modifier = Modifier.width(10.dp))
                      Text(
                          text = statusText,
                          color = textColor,
                          fontSize = 15.sp,
                          fontWeight = FontWeight.Bold
                      )
                  }
                  if (peerName != null && state == P2pState.CONNECTED) {
                      Text(
                          text = peerName,
                          color = textColor.copy(alpha = 0.8f),
                          fontSize = 13.sp
                      )
                  }
              }
          }
          KT
          echo "✅ P2pStatusIndicator.kt created"

      - name: Safely inject imports and UI into Home Screens
        run: |
          python3 << 'PYTHON'
          import re

          def update_screen(file_path, screen_name):
              with open(file_path, 'r', encoding='utf-8') as f:
                  content = f.read()

              if 'P2pStatusIndicator' in content:
                  print(f"✅ {screen_name} already updated.")
                  return

              # 1. Safely add imports AFTER the package declaration
              pattern = r'^(package\s+[\w\.]+)'
              imports = r'\1\n\nimport com.linkdeck.app.ui.components.P2pStatusIndicator\nimport com.linkdeck.app.ui.components.P2pState'
              content = re.sub(pattern, imports, content, flags=re.MULTILINE)

              # 2. Safely add the UI component inside the first Column of the screen
              ui_pattern = rf'(fun {screen_name}\([^)]*\)[^{{]*\{{[^}}]*Column\([^)]*\)\s*\{{)'
              match = re.search(ui_pattern, content, re.DOTALL)
              
              if match:
                  insertion = match.end()
                  status_code = f'''
                  
                      // P2P Status Indicator
                      P2pStatusIndicator(state = P2pState.DISCONNECTED)
                      Spacer(modifier = Modifier.height(16.dp))
                  '''
                  content = content[:insertion] + status_code + content[insertion:]
                  print(f"✅ {screen_name} updated successfully with P2P status.")
              else:
                  print(f"⚠️ Could not find Column in {screen_name}, but imports were added safely.")

              with open(file_path, 'w', encoding='utf-8') as f:
                  f.write(content)

          update_screen("app/src/main/java/com/linkdeck/app/ui/home/HostHomeScreen.kt", "HostHomeScreen")
          update_screen("app/src/main/java/com/linkdeck/app/ui/home/ControllerHomeScreen.kt", "ControllerHomeScreen")
          PYTHON

      - name: Build app
        run: |
          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew clean :app:assembleDebug
          else
              gradle clean :app:assembleDebug
          fi

      - name: Package ZIP
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          ZIP="LinkDeck_v${V}_build${B}_${D}.zip"
          mkdir -p out
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && echo "❌ No APK!" && exit 1
          cp "$APK" out/LinkDeck.apk
          echo "Built with BFB.AI - Phase 14: P2P Status Fixed" > out/BFB.txt
          cd out && zip -r "../$ZIP" . && cd ..
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: "LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})"
          body: |
            ## 📡 Phase 14 - P2P Status Indicator (Fixed)
            **Built with BFB.AI - Built For Benefits, by AI**
            
            ### What's Fixed
            - ✅ Fixed Kotlin import placement (now correctly placed after `package` declaration)
            - ✅ Added P2P Status Indicator to Host and Controller screens
            - ✅ Shows connection state: Disconnected (red), Searching (yellow), Connected (green)
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
