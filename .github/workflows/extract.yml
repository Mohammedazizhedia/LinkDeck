name: Extract and Build
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o app.zip
          mv LinkDeck/* LinkDeck/.github . 2>/dev/null || true
          mv LinkDeck/.* . 2>/dev/null || true
          rm -rf LinkDeck app.zip
      - name: Verify fixed sources
        run: |
          grep -q "parseLinePath" core-design/src/main/java/com/linkdeck/core/design/LineIcons.kt
          grep -q "loadAppTypeface" core-design/src/main/java/com/linkdeck/core/design/Type.kt
          grep -q "applicationEngineEnvironment" core-network/src/main/java/com/linkdeck/core/network/HostServer.kt
          echo "FIXED SOURCES VERIFIED"
      - name: Commit and push
        run: |
          git config user.name "Mohammedazizhedia"
          git config user.email "mohammedazizhedia@gmail.com"
          git add -A
          git commit -m "Extract fixed project from app.zip" || echo "nothing to commit"
          git push
