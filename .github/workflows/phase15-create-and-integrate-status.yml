name: Phase 15 - Create and Integrate P2P Status

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.12.0'
      build_number:
        description: 'Build number'
        required: true
        default: '016'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Step 1 - Create P2P Status Indicator Component
        run: |
          mkdir -p app/src/main/java/com/linkdeck/app/ui/components
          cat > app/src/main/java/com/linkdeck/app/ui/components/P2pStatusIndicator.kt << 'KT'
          package com.linkdeck.app.ui.components

          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          enum class P2pState {
              DISCONNECTED, SEARCHING, CONNECTED
          }

          private data class StatusTheme(
              val bgColor: Color,
              val textColor: Color,
              val statusText: String
          )

          @Composable
          fun P2pStatusIndicator(state: P2pState, peerName: String? = null) {
              val theme = when (state) {
                  P2pState.DISCONNECTED -> StatusTheme(Color(0xFF3A1212), Color(0xFFF87171), "غير متصل")
                  P2pState.SEARCHING -> StatusTheme(Color(0xFF3A2A10), Color(0xFFFBBF24), "جاري البحث...")
                  P2pState.CONNECTED -> StatusTheme(Color(0xFF12322E), Color(0xFF5EEAD4), "متصل")
              }

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(12.dp))
                      .background(theme.bgColor)
                      .padding(horizontal = 16.dp, vertical = 10.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.SpaceBetween
              ) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Box(
                          modifier = Modifier
                              .size(10.dp)
                              .clip(RoundedCornerShape(50))
                              .background(theme.textColor)
                      )
                      Spacer(modifier = Modifier.width(10.dp))
                      Text(
                          text = theme.statusText,
                          color = theme.textColor,
                          fontSize = 15.sp,
                          fontWeight = FontWeight.Bold
                      )
                  }
                  if (peerName != null && state == P2pState.CONNECTED) {
                      Text(
                          text = peerName,
                          color = theme.textColor.copy(alpha = 0.8f),
                          fontSize = 13.sp
                      )
                  }
              }
          }
          KT
          
          if [ -f "app/src/main/java/com/linkdeck/app/ui/components/P2pStatusIndicator.kt" ]; then
              echo "✅ P2pStatusIndicator.kt created successfully"
          else
              echo "❌ Failed to create P2pStatusIndicator.kt"
              exit 1
          fi

      - name: Step 2 - Restore home screens to clean state
        run: |
          git checkout HEAD -- app/src/main/java/com/linkdeck/app/ui/home/HostHomeScreen.kt
          git checkout HEAD -- app/src/main/java/com/linkdeck/app/ui/home/ControllerHomeScreen.kt
          echo "✅ Home screens restored to clean state"

      - name: Step 3 - Add P2P status to home screens
        run: |
          python3 << 'PYTHON'
          import re

          def add_status_to_screen(file_path, function_name):
              with open(file_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              if 'P2pStatusIndicator' in content:
                  print(f"✅ {function_name} already has status indicator")
                  return True
              
              # Add imports after package
              content = re.sub(
                  r'^(package\s+[\w\.]+)',
                  r'\1\n\nimport androidx.compose.foundation.layout.Spacer\nimport androidx.compose.foundation.layout.height\nimport com.linkdeck.app.ui.components.P2pStatusIndicator\nimport com.linkdeck.app.ui.components.P2pState',
                  content,
                  flags=re.MULTILINE
              )
              
              # Find the function and add status after the first layout element
              pattern = rf'(fun {function_name}\([^)]*\)[^{{]*\{{)'
              match = re.search(pattern, content, re.DOTALL)
              
              if match:
                  func_start = match.end()
                  remaining = content[func_start:]
                  
                  # Find first Box, Column, Surface, or Row
                  layout_match = re.search(r'(Box|Column|Surface|Row)\s*\([^)]*\)\s*\{{', remaining)
                  if layout_match:
                      insert_pos = func_start + layout_match.end()
                      status_code = f'''
                      
                          // P2P Status Indicator
                          P2pStatusIndicator(state = P2pState.DISCONNECTED)
                          Spacer(modifier = Modifier.height(16.dp))
                      '''
                      content = content[:insert_pos] + status_code + content[insert_pos:]
                      print(f"✅ Added P2pStatusIndicator to {function_name}")
                      with open(file_path, 'w', encoding='utf-8') as f:
                          f.write(content)
                      return True
              
              print(f"⚠️ Could not modify {function_name}")
              return False

          success1 = add_status_to_screen("app/src/main/java/com/linkdeck/app/ui/home/HostHomeScreen.kt", "HostHomeScreen")
          success2 = add_status_to_screen("app/src/main/java/com/linkdeck/app/ui/home/ControllerHomeScreen.kt", "ControllerHomeScreen")
          
          if success1 and success2:
              print("✅ Both screens updated successfully")
          else:
              print("⚠️ Some screens may not have been updated")
          PYTHON

      - name: Build app
        run: |
          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew clean :app:assembleDebug
          else
              gradle clean :app:assembleDebug
          fi

      - name: Package ZIP
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          ZIP="LinkDeck_v${V}_build${B}_${D}.zip"
          mkdir -p out
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && echo "❌ No APK!" && exit 1
          cp "$APK" out/LinkDeck.apk
          echo "Built with BFB.AI - Phase 15: P2P Status" > out/BFB.txt
          cd out && zip -r "../$ZIP" . && cd ..
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: "LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})"
          body: |
            ## 📡 Phase 15 - P2P Status Indicator
            **Built with BFB.AI - Built For Benefits, by AI**
            
            ### What's New
            - ✅ Created P2pStatusIndicator component
            - ✅ Integrated into Host and Controller home screens
            - ✅ Shows connection status with colored indicators
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
