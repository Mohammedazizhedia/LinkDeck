name: Build LinkDeck APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate wrapper (no binary jar in repo)
        run: gradle wrapper --gradle-version 8.9

      - name: Decode signing keystore (optional)
        if: ${{ secrets.LINKDECK_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.LINKDECK_KEYSTORE_BASE64 }}" | base64 -d > linkdeck-release.keystore
          cat > keystore.properties <<EOF
          storeFile=linkdeck-release.keystore
          storePassword=${{ secrets.LINKDECK_STORE_PASSWORD }}
          keyAlias=${{ secrets.LINKDECK_KEY_ALIAS }}
          keyPassword=${{ secrets.LINKDECK_KEY_PASSWORD }}
          EOF

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK (signed if secrets present)
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          LINKDECK_KEYSTORE_FILE: linkdeck-release.keystore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: linkdeck-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: linkdeck-release
          path: app/build/outputs/apk/release/*.apk
