name: Build LinkDeck APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # ✅ تعديل اسم الـ APK عشان يطلع LinkDeck_v1.0_build#XXX.apk
      - name: Rename APK
        run: |
          # البحث عن ملف الـ APK وتغيير اسمه
          find app/build/outputs/apk/debug -name "*.apk" -exec bash -c 'mv "$1" "app/build/outputs/apk/debug/LinkDeck_v1.0_build#${GITHUB_RUN_NUMBER}.apk"' _ {} \;
          
      - name: Build Debug APK
        run: gradle :app:assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkDeck_Build_${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk

      # ✅ إضافة ملف BFB.txt جوه الـ Artifact (لو عايزه يتحط جوه ZIP)
      - name: Create BFB Archive
        run: |
          mkdir -p release_archive
          cp app/build/outputs/apk/debug/*.apk release_archive/
          cp BFB.txt release_archive/
          cd release_archive && zip -r ../LinkDeck_v1.0_build#${GITHUB_RUN_NUMBER}.zip *
          
      - name: Upload ZIP (with BFB.txt)
        uses: actions/upload-artifact@v4
        with:
          name: LinkDeck_Archive_${{ github.run_number }}
          path: LinkDeck_v1.0_build#*.zip
