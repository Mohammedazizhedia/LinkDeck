name: Build LinkDeck APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          
      # 1. البناء الأول
      - name: Build Debug APK
        run: gradle :app:assembleDebug

      # 2. تسمية الـ APK
      - name: Rename APK
        run: |
          mkdir -p app/build/outputs/apk/debug/
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LinkDeck_${{ github.run_number }}.apk || true

      # 3. رفع الـ APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkDeck_APK_${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
