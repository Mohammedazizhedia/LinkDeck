name: About + Version + BFB

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add About section + version label
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys

          def patch(path, old, new, label):
              p = pathlib.Path(path); t = p.read_text(encoding="utf-8")
              if new in t: print("skip:", label); return
              if old not in t: print("ANCHOR MISSING:", label); sys.exit(1)
              p.write_text(t.replace(old, new, 1), encoding="utf-8"); print("patched:", label)

          # 1) gradle version (idempotent)
          g = pathlib.Path("app/build.gradle.kts")
          t = g.read_text(encoding="utf-8")
          if 'versionName = "0.3.0"' not in t:
              if 'versionName = "0.1.0-phase1"' in t:
                  g.write_text(t.replace('versionCode = 1\n        versionName = "0.1.0-phase1"',
                                         'versionCode = 3\n        versionName = "0.3.0"'), encoding="utf-8")
                  print("patched: gradle version")
              else:
                  print("skip: gradle version (unknown form)")

          # 2) About section in Settings (app name + version + BFB signature)
          ABOUT = '''            Spacer(Modifier.height(Spacing.sm))
            Surface(
                color = MaterialTheme.colorScheme.surfaceVariant,
                shape = RoundedCornerShape((12 * LinkDeckTheme.cornerScale).dp),
                modifier = Modifier.fillMaxWidth(),
            ) {
                Column(Modifier.padding(Spacing.xl)) {
                    Text(
                        stringResource(R.string.app_name) + "  v" + com.linkdeck.app.BuildConfig.VERSION_NAME,
                        style = MaterialTheme.typography.titleMedium,
                    )
                    Text(
                        "Built For Benefits, by AI — BFB.AI",
                        style = MaterialTheme.typography.bodySmall,
                        color = MaterialTheme.colorScheme.primary,
                    )
                }
            }

'''
          patch("app/src/main/java/com/linkdeck/app/ui/settings/SettingsScreen.kt",
                '''            Spacer(Modifier.height(Spacing.sm))
            OutlinedButton(
                onClick = {
                    vm.settings.resetToDefaults()''',
                ABOUT + '''            Spacer(Modifier.height(Spacing.sm))
            OutlinedButton(
                onClick = {
                    vm.settings.resetToDefaults()''',
                "About section")

          # 3) version label on QR screen (idempotent)
          s = pathlib.Path("app/src/main/java/com/linkdeck/app/ui/pairing/ShowQrScreen.kt")
          t = s.read_text(encoding="utf-8")
          if "BuildConfig.VERSION_NAME" not in t:
              old = '''            Text(
                text = payload.ip,
                style = MaterialTheme.typography.bodySmall,
                color = MaterialTheme.colorScheme.onSurfaceVariant,
            )'''
              new = old + '''
            Spacer(Modifier.height(Spacing.xs))
            Text(
                text = stringResource(R.string.app_name) + " " + com.linkdeck.app.BuildConfig.VERSION_NAME + " (" + com.linkdeck.app.BuildConfig.BUILD_TYPE + ")",
                style = MaterialTheme.typography.labelSmall,
                color = MaterialTheme.colorScheme.outline,
            )'''
              if old in t:
                  s.write_text(t.replace(old, new, 1), encoding="utf-8")
                  print("patched: QR version label")
              else:
                  print("skip: QR label anchor")
          else:
              print("skip: QR label exists")
          print("ALL OK")
          PYEOF
      - name: Commit and push
        run: |
          git config user.name "Mohammedazizhedia"
          git config user.email "mohammedazizhedia@gmail.com"
          git add -A
          git commit -m "About section: name + version + BFB.AI signature"
          git push
