name: Phase 13 - Stability & Typography Fix

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.10.0'
      build_number:
        description: 'Build number'
        required: true
        default: '014'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean up old broken workflows
        run: |
          rm -f .github/workflows/phase10-*.yml
          rm -f .github/workflows/phase11-*.yml
          rm -f .github/workflows/phase12-*.yml
          echo "✅ Cleaned up old broken workflows"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Fix Navigation Back Stack & Bold Typography
        run: |
          python3 << 'PYTHON'
          import re

          # 1. Fix AppNavHost.kt Navigation
          nav_file = "app/src/main/java/com/linkdeck/app/AppNavHost.kt"
          with open(nav_file, 'r', encoding='utf-8') as f:
              nav_content = f.read()

          # Ensure popBackStack is used correctly and doesn't pop the HOME destination
          # We will make sure sub-screens pop to HOME, not out of the app
          nav_content = re.sub(
              r'composable\(Routes\.HOME\)\s*\{\s*HomeRouter\(navController\)\s*\}',
              'composable(Routes.HOME) { HomeRouter(navController) }', 
              nav_content
          )
          
          with open(nav_file, 'w', encoding='utf-8') as f:
              f.write(nav_content)
          print("✅ Navigation stack stabilized")

          # 2. Fix Bold Typography in ModeSelectionScreen
          mode_file = "app/src/main/java/com/linkdeck/app/ui/mode/ModeSelectionScreen.kt"
          
          # Read original file
          with open(mode_file, 'r', encoding='utf-8') as f:
              mode_content = f.read()

          # Force explicit bold weights and ensure they are applied
          # Replace standard title with explicitly bold version
          mode_content = re.sub(
              r'style = MaterialTheme\.typography\.headlineMedium',
              'style = MaterialTheme.typography.headlineMedium.copy(fontWeight = androidx.compose.ui.text.font.FontWeight.ExtraBold)',
              mode_content
          )
          
          mode_content = re.sub(
              r'style = MaterialTheme\.typography\.titleLarge',
              'style = MaterialTheme.typography.titleLarge.copy(fontWeight = androidx.compose.ui.text.font.FontWeight.Bold)',
              mode_content
          )

          with open(mode_file, 'w', encoding='utf-8') as f:
              f.write(mode_content)
          print("✅ Bold typography explicitly enforced")
          PYTHON

      - name: Build app
        run: |
          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew clean :app:assembleDebug
          else
              gradle clean :app:assembleDebug
          fi

      - name: Package ZIP
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          ZIP="LinkDeck_v${V}_build${B}_${D}.zip"
          mkdir -p out
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && echo "❌ No APK!" && exit 1
          cp "$APK" out/LinkDeck.apk
          echo "Built with BFB.AI - Phase 13: Stability Fix" > out/BFB.txt
          cd out && zip -r "../$ZIP" . && cd ..
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: "LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})"
          body: |
            ## 🛡️ Phase 13 - Stability & Typography Fix
            **Built with BFB.AI - Built For Benefits, by AI**
            
            ### What's Fixed
            - ✅ **Navigation Fixed:** Pressing back from sub-screens now correctly returns to the Home screen instead of exiting the app.
            - ✅ **Bold Text Fixed:** Explicitly enforced `FontWeight.ExtraBold` and `FontWeight.Bold` to ensure titles and buttons appear thick and clear, overriding any theme font limitations.
            - ✅ **Cleanup:** Removed all previous broken workflow files.
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
