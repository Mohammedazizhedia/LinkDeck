name: Phase 12 - Final Navigation Fix (The Real Root Cause)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.9.3'
      build_number:
        description: 'Build number'
        required: true
        default: '013'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original ModeSelectionScreen.kt
        run: |
          git checkout HEAD -- app/src/main/java/com/linkdeck/app/ui/mode/ModeSelectionScreen.kt
          echo "✅ Restored original ModeSelectionScreen.kt"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Fix AppNavHost.kt null state trap
        run: |
          FILE="app/src/main/java/com/linkdeck/app/AppNavHost.kt"
          
          # Add CircularProgressIndicator import if not present
          if ! grep -q "import androidx.compose.material3.CircularProgressIndicator" "$FILE"; then
              sed -i '/import androidx.compose.material3.Text/a import androidx.compose.material3.CircularProgressIndicator' "$FILE"
          fi

          # Replace the dead ModeSelectionScreen(onModeChosen = {}) with a Loading indicator
          sed -i 's/null -> ModeSelectionScreen(onModeChosen = {})/null -> Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { CircularProgressIndicator() }/g' "$FILE"
          
          echo "✅ Fixed the null state trap in AppNavHost.kt"
          echo "📄 Verifying the fix:"
          grep -A 1 "null ->" "$FILE"

      - name: Build app
        run: |
          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew clean :app:assembleDebug
          else
              gradle clean :app:assembleDebug
          fi

      - name: Package ZIP
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          ZIP="LinkDeck_v${V}_build${B}_${D}.zip"
          mkdir -p out
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && echo "❌ No APK!" && exit 1
          cp "$APK" out/LinkDeck.apk
          echo "Built with BFB.AI - Phase 12: Final Fix" > out/BFB.txt
          cd out && zip -r "../$ZIP" . && cd ..
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: "LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})"
          body: |
            ## 🎯 Phase 12 - FINAL NAVIGATION FIX
            **Built with BFB.AI - Built For Benefits, by AI**
            
            ### The Real Root Cause Fixed
            - ✅ Fixed the "null state trap" in HomeRouter that was showing dead buttons.
            - ✅ Now shows a brief loading indicator while mode is being saved.
            - ✅ Automatically transitions to Host or Controller screen after mode is saved.
            
            **Buttons will now work perfectly and navigate to the correct screen!**
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
