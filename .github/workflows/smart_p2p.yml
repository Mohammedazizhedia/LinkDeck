name: Smart P2P Fix

on:
  workflow_dispatch:

jobs:
  fix-and-inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Inspect and Fix Files
        run: |
          python3 - <<'PYEOF'
          import pathlib, os, re, sys

          print("=== 1. Inspecting files ===")
          paths_to_check = [
              "app/src/main/java/com/linkdeck/app/pairing/PairingManager.kt",
              "core-network/src/main/java/com/linkdeck/core/network/PairingManager.kt",
              "app/src/main/java/com/linkdeck/app/ui/home/HostHomeScreen.kt"
          ]
          
          for p in paths_to_check:
              if os.path.exists(p):
                  print(f"FOUND: {p}")
              else:
                  print(f"MISSING: {p}")

          # --- Fix PairingManager ---
          pm_path = "app/src/main/java/com/linkdeck/app/pairing/PairingManager.kt"
          if os.path.exists(pm_path):
              pm_file = pathlib.Path(pm_path)
              pm_text = pm_file.read_text(encoding="utf-8")
              
              # Fix P2P logic if missing
              if "fun hostAutoP2p()" not in pm_text:
                  p2p_logic = """
    private val _p2pCode = MutableStateFlow<String?>(null)
    val p2pCode: StateFlow<String?> = _p2pCode

    fun hostAutoP2p() {
        if (_p2pCode.value != null) return
        val p2p = P2pManager(context)
        p2p.startDiscovery()
        p2p.createGroup()
        scope.launch {
            p2p.connectionInfo.collect { info ->
                if (info?.isGroupOwner == true && _p2pCode.value == null) {
                    _p2pCode.value = hostStartP2p()
                }
            }
        }
    }

    fun startDiscovery()"""
                  if "fun startDiscovery()" in pm_text:
                      pm_text = pm_text.replace("fun startDiscovery()", p2p_logic, 1)
                  else:
                      pm_text = pm_text[::-1].replace("}", p2p_logic[::-1], 1)[::-1]
                  
                  pm_file.write_text(pm_text, encoding="utf-8")
                  print("✅ Added hostAutoP2p to PairingManager.kt")
              else:
                  print("ℹ️ PairingManager.kt already has hostAutoP2p")

          # --- Fix HostHomeScreen ---
          hs_path = "app/src/main/java/com/linkdeck/app/ui/home/HostHomeScreen.kt"
          if os.path.exists(hs_path):
              hs_file = pathlib.Path(hs_path)
              hs_text = hs_file.read_text(encoding="utf-8")
              
              hs_text = hs_text.replace("import com.linkdeck.core.network.PairingManager", "import com.linkdeck.app.pairing.PairingManager")
              
              if "p2pCode" not in hs_text:
                  qr_button_pattern = r'(Button\(onClick = \{\s*vm\.pairingManager\.hostStart\(\)\s*onShowQr\(\)\s*\}\)\s*\{\s*Text\(stringResource\(R\.string\.show_qr\)\)\s*\})'
                  
                  p2p_ui = r"""\1
            Spacer(Modifier.height(Spacing.sm))
            val p2pCode by vm.pairingManager.p2pCode.collectAsState()
            if (p2pCode != null) {
                Text(
                    text = "كود الاقتران: $p2pCode",
                    style = MaterialTheme.typography.titleLarge,
                    color = LinkDeckTheme.tints.accentFg,
                    modifier = Modifier.padding(vertical = Spacing.md)
                )
            }
            OutlinedButton(onClick = { vm.pairingManager.hostAutoP2p() }) { 
                Text("تشغيل Wi-Fi Direct") 
            }"""
                  
                  hs_text = re.sub(qr_button_pattern, p2p_ui, hs_text)
                  hs_file.write_text(hs_text, encoding="utf-8")
                  print("✅ Added P2P UI to HostHomeScreen.kt")
              else:
                  print("ℹ️ HostHomeScreen.kt already has P2P UI")
                  
          PYEOF

      - name: Commit and Push
        run: |
          git config user.name "Mohammedazizhedia"
          git config user.email "mohammedazizhedia@gmail.com"
          git add -A
          git commit -m "Smart Fix: Add Wi-Fi Direct P2P safely" || echo "No changes"
          git push
