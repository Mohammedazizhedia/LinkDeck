name: Phase 7 - UI Typography & Spacing Polish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.6.0'
      build_number:
        description: 'Build number'
        required: true
        default: '007'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Polish ModeSelectionScreen Typography & Spacing
        run: |
          mkdir -p app/src/main/java/com/linkdeck/app/ui/mode
          cat > app/src/main/java/com/linkdeck/app/ui/mode/ModeSelectionScreen.kt << 'KT'
          package com.linkdeck.app.ui.mode

          import androidx.compose.animation.core.*
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          @Composable
          fun ModeSelectionScreen(onModeChosen: (String) -> Unit) {
              val infiniteTransition = rememberInfiniteTransition(label = "orb")
              val scale by infiniteTransition.animateFloat(
                  initialValue = 1f,
                  targetValue = 1.05f,
                  animationSpec = infiniteRepeatable(animation = tween(2000, easing = CubicBezierEasing(0.37f, 0f, 0.63f, 1f)), repeatMode = RepeatMode.Reverse),
                  label = "scale"
              )

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF0E0B1F))
                      .padding(horizontal = 32.dp, vertical = 48.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.spacedBy(24.dp)
              ) {
                  // Glowing Orb
                  Box(modifier = Modifier.size(200.dp), contentAlignment = Alignment.Center) {
                      Box(modifier = Modifier.size(200.dp).border(1.dp, Color(0xFF2B2650), CircleShape))
                      Box(modifier = Modifier.size(150.dp).border(1.dp, Color(0xFF4A4290), CircleShape))
                      Box(
                          modifier = Modifier
                              .size(100.dp)
                              .scale(scale)
                              .background(Color(0xFF5B4BD6), CircleShape)
                              .border(2.dp, Color(0xFF7B6FE6), CircleShape),
                          contentAlignment = Alignment.Center
                      ) {
                          Text("LD", color = Color.White, fontSize = 28.sp, fontWeight = FontWeight.ExtraBold)
                      }
                  }

                  Spacer(modifier = Modifier.height(8.dp))

                  // Title
                  Text(
                      text = "LinkDeck",
                      color = Color(0xFFEDEBFF),
                      fontSize = 36.sp,
                      fontWeight = FontWeight.ExtraBold,
                      letterSpacing = 1.5.sp
                  )
                  
                  // Subtitle (Optimized for Arabic RTL)
                  Text(
                      text = "اختر وضع التشغيل لهذا الجهاز",
                      color = Color(0xFFA9A4CF),
                      fontSize = 18.sp,
                      fontWeight = FontWeight.Medium,
                      lineHeight = 26.sp,
                      textAlign = TextAlign.Center,
                      modifier = Modifier.padding(horizontal = 16.dp)
                  )

                  Spacer(modifier = Modifier.height(16.dp))

                  // Host Button
                  Button(
                      onClick = { onModeChosen("host") },
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(64.dp),
                      shape = RoundedCornerShape(16.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF5B4BD6))
                  ) {
                      Text(
                          text = "جهاز مضيف (Host)",
                          fontSize = 18.sp,
                          fontWeight = FontWeight.SemiBold,
                          letterSpacing = 0.5.sp
                      )
                  }

                  // Controller Button
                  OutlinedButton(
                      onClick = { onModeChosen("controller") },
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(64.dp),
                      shape = RoundedCornerShape(16.dp),
                      colors = ButtonDefaults.outlinedButtonColors(contentColor = Color(0xFFB9AFFF)),
                      border = BorderStroke(1.5.dp, Color(0xFF2B2650))
                  ) {
                      Text(
                          text = "جهاز متحكم (Controller)",
                          fontSize = 18.sp,
                          fontWeight = FontWeight.SemiBold,
                          letterSpacing = 0.5.sp
                      )
                  }
              }
          }
          KT
          echo "✅ ModeSelectionScreen.kt polished with better typography and spacing"

      - name: Build app
        run: |
          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew :app:assembleDebug
          else
              gradle :app:assembleDebug
          fi

      - name: Package ZIP
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          ZIP="LinkDeck_v${V}_build${B}_${D}.zip"
          mkdir -p out
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && echo "❌ No APK!" && exit 1
          cp "$APK" out/LinkDeck.apk
          echo "Built with BFB.AI - Phase 7: UI Polish" > out/BFB.txt
          cd out && zip -r "../$ZIP" . && cd ..
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: "LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})"
          body: |
            ## 🎨 Phase 7 - UI Typography & Spacing Polish
            **Built with BFB.AI - Built For Benefits, by AI**
            
            ### What's Improved
            - ✅ Larger, bolder title with premium letter spacing
            - ✅ Optimized Arabic subtitle (better size, line height, and center alignment)
            - ✅ Taller, more touch-friendly buttons with clearer text
            - ✅ Balanced vertical spacing for a modern, clean look
            
            *(App icon remains unchanged)*
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
