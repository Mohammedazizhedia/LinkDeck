name: Phase 4 - Safe UI Addition

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.3.0'
      build_number:
        description: 'Build number'
        required: true
        default: '004'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Restore original MainActivity.kt (Fix Hilt/ViewModel)
        run: |
          cat > app/src/main/java/com/linkdeck/app/MainActivity.kt << 'KT'
          package com.linkdeck.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Surface
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.collectAsState
          import androidx.compose.runtime.getValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.hilt.navigation.compose.hiltViewModel
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import com.linkdeck.core.design.AppFont
          import com.linkdeck.core.design.IconStroke
          import com.linkdeck.core.design.ThemeMode
          import com.linkdeck.core.design.AccentTheme
          import com.linkdeck.core.design.AppLanguage
          import com.linkdeck.core.design.loadAppFontFamily
          import com.linkdeck.core.design.theme.LinkDeckTheme
          import com.linkdeck.core.design.LanguageRestartEffect
          import com.linkdeck.core.design.CrashDialogEffect
          import dagger.hilt.android.AndroidEntryPoint
          import dagger.hilt.android.lifecycle.HiltViewModel
          import kotlinx.coroutines.flow.SharingStarted
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.stateIn
          import javax.inject.Inject

          @HiltViewModel
          class MainViewModel @Inject constructor(val settings: com.linkdeck.app.settings.SettingsStore) : ViewModel() {
              val themeMode: StateFlow<ThemeMode> = settings.themeMode.stateIn(viewModelScope, SharingStarted.Eagerly, ThemeMode.SYSTEM)
              val accent: StateFlow<AccentTheme> = settings.accent.stateIn(viewModelScope, SharingStarted.Eagerly, AccentTheme.DEFAULT)
              val language: StateFlow<AppLanguage> = settings.language.stateIn(viewModelScope, SharingStarted.Eagerly, AppLanguage.AUTO)
              val fontFamily: StateFlow<AppFont> = settings.fontFamily.stateIn(viewModelScope, SharingStarted.Eagerly, AppFont.CAIRO)
              val fontScale: StateFlow<Float> = settings.fontScale.stateIn(viewModelScope, SharingStarted.Eagerly, 1f)
              val fontWeight: StateFlow<Int> = settings.fontWeight.stateIn(viewModelScope, SharingStarted.Eagerly, 500)
              val cornerScale: StateFlow<Float> = settings.cornerScale.stateIn(viewModelScope, SharingStarted.Eagerly, 1f)
              val iconStroke: StateFlow<IconStroke> = settings.iconStroke.stateIn(viewModelScope, SharingStarted.Eagerly, IconStroke.REGULAR)
          }

          @AndroidEntryPoint
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent {
                      val vm: MainViewModel = hiltViewModel()
                      val themeMode by vm.themeMode.collectAsState()
                      val accent by vm.accent.collectAsState()
                      val font by vm.fontFamily.collectAsState()
                      val fontScale by vm.fontScale.collectAsState()
                      val fontWeight by vm.fontWeight.collectAsState()
                      val cornerScale by vm.cornerScale.collectAsState()
                      val iconStroke by vm.iconStroke.collectAsState()
                      val context = LocalContext.current
                      val family = loadAppFontFamily(context, font, fontWeight)
                      val language by vm.language.collectAsState()
                      
                      LanguageRestartEffect(language)
                      CrashDialogEffect()
                      
                      LinkDeckTheme(
                          mode = themeMode,
                          accent = accent,
                          fontFamily = family,
                          fontScale = fontScale,
                          fontWeight = fontWeight,
                          cornerScale = cornerScale,
                          iconStroke = iconStroke,
                      ) {
                          Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              // Note: AppNavHost is assumed to be in the same package or imported
                              com.linkdeck.app.ui.AppNavHost(navController = androidx.navigation.compose.rememberNavController())
                          }
                      }
                  }
              }
          }
          KT
          echo "✅ Original MainActivity.kt restored with Hilt/ViewModel intact"

      - name: Create RoleSelectionScreen.kt (New Safe Component)
        run: |
          mkdir -p app/src/main/java/com/linkdeck/app/ui
          cat > app/src/main/java/com/linkdeck/app/ui/RoleSelectionScreen.kt << 'KT'
          package com.linkdeck.app.ui

          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp

          @Composable
          fun RoleSelectionScreen(
              onHostSelected: () -> Unit,
              onControllerSelected: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Text(
                      text = "LinkDeck",
                      style = MaterialTheme.typography.headlineMedium,
                      modifier = Modifier.padding(bottom = 8.dp)
                  )
                  Text(
                      text = "اختر وضع التشغيل لهذا الجهاز",
                      style = MaterialTheme.typography.bodyMedium,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                      textAlign = TextAlign.Center,
                      modifier = Modifier.padding(bottom = 48.dp)
                  )

                  Button(
                      onClick = onHostSelected,
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(56.dp),
                      shape = MaterialTheme.shapes.large
                  ) {
                      Text("جهاز مضيف (Host)", style = MaterialTheme.typography.titleLarge)
                  }

                  Spacer(modifier = Modifier.height(16.dp))

                  OutlinedButton(
                      onClick = onControllerSelected,
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(56.dp),
                      shape = MaterialTheme.shapes.large
                  ) {
                      Text("جهاز متحكم (Controller)", style = MaterialTheme.typography.titleLarge)
                  }
              }
          }
          KT
          echo "✅ RoleSelectionScreen.kt created safely"

      - name: Build app
        run: |
          echo "🔨 Building app with restored architecture and new UI component..."
          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew :app:assembleDebug --stacktrace
          else
              gradle :app:assembleDebug --stacktrace
          fi

      - name: Package ZIP
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          ZIP="LinkDeck_v${V}_build${B}_${D}.zip"
          mkdir -p out
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
              echo "❌ No APK found!"
              exit 1
          fi
          cp "$APK" out/LinkDeck.apk
          cat > out/BFB.txt << 'BFB'
          ═══════════════════════════════════════════════════
          BFB.AI - Built For Benefits, by AI
          ═══════════════════════════════════════════════════
          Name:    LinkDeck
          Version: VERSION_PLACEHOLDER
          Build:   BUILD_PLACEHOLDER
          Date:    DATE_PLACEHOLDER
          Phase:   4 - Safe UI Addition (Hilt Restored)
          ═══════════════════════════════════════════════════
          BFB
          sed -i "s/VERSION_PLACEHOLDER/$V/" out/BFB.txt
          sed -i "s/BUILD_PLACEHOLDER/#$B/" out/BFB.txt
          sed -i "s/DATE_PLACEHOLDER/$D/" out/BFB.txt
          cd out && zip -r "../$ZIP" . && cd ..
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})
          body: |
            ## 📱 Phase 4 - Safe UI Addition
            **Built with BFB.AI - Built For Benefits, by AI**
            
            ### What's New
            - ✅ Restored original MainActivity.kt (Hilt & MainViewModel fixed)
            - ✅ Added RoleSelectionScreen.kt (Ready for integration)
            
            SHA256: $(cat ${{ env.ZIP_NAME }}.sha256 | cut -d' ' -f1)
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
