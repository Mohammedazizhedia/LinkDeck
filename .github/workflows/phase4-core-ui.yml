name: Phase 4 - Quick Fix

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.3.0'
      build_number:
        description: 'Build number'
        required: true
        default: '004'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore MainActivity from HEAD
        run: |
          git checkout HEAD -- app/src/main/java/com/linkdeck/app/MainActivity.kt
          echo "✅ MainActivity.kt restored to original version"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Create RoleSelectionScreen.kt
        run: |
          mkdir -p app/src/main/java/com/linkdeck/app/ui
          cat > app/src/main/java/com/linkdeck/app/ui/RoleSelectionScreen.kt << 'KT'
          package com.linkdeck.app.ui

          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp

          @Composable
          fun RoleSelectionScreen(
              onHostSelected: () -> Unit,
              onControllerSelected: () -> Unit
          ) {
              Column(
                  modifier = Modifier.fillMaxSize().padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Text(text = "LinkDeck", style = MaterialTheme.typography.headlineMedium, modifier = Modifier.padding(bottom = 8.dp))
                  Text(text = "اختر وضع التشغيل", style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant, textAlign = TextAlign.Center, modifier = Modifier.padding(bottom = 48.dp))
                  Button(onClick = onHostSelected, modifier = Modifier.fillMaxWidth().height(56.dp), shape = MaterialTheme.shapes.large) { Text("جهاز مضيف (Host)", style = MaterialTheme.typography.titleLarge) }
                  Spacer(modifier = Modifier.height(16.dp))
                  OutlinedButton(onClick = onControllerSelected, modifier = Modifier.fillMaxWidth().height(56.dp), shape = MaterialTheme.shapes.large) { Text("جهاز متحكم (Controller)", style = MaterialTheme.typography.titleLarge) }
              }
          }
          KT
          echo "✅ RoleSelectionScreen.kt created"

      - name: Build app
        run: |
          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew :app:assembleDebug
          else
              gradle :app:assembleDebug
          fi

      - name: Package ZIP
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          ZIP="LinkDeck_v${V}_build${B}_${D}.zip"
          mkdir -p out
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && echo "❌ No APK!" && exit 1
          cp "$APK" out/LinkDeck.apk
          echo "Built with BFB.AI" > out/BFB.txt
          cd out && zip -r "../$ZIP" . && cd ..
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: "LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})"
          body: "✅ Fixed MainActivity + Added RoleSelectionScreen"
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
