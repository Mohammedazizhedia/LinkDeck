name: Cleanup Workflows

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete all workflows except Build
        run: |
          find .github/workflows -type f ! -name 'build.yml' -delete
          git add -A
          git commit -m "Cleanup: keep only Build workflow"
          git push
