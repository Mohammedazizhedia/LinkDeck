name: Phase 2 - App Icon Only

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.1.0'
      build_number:
        description: 'Build number'
        required: true
        default: '002'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Create App Icon
        run: |
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable

          cat > app/src/main/res/drawable/ic_launcher_background.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0E0B1F"/>
          </shape>
          XML

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#00000000" android:strokeColor="#B9AFFF" android:strokeWidth="2"
                  android:pathData="M54,54m-38,0a38,38 0,1 1,76 0a38,38 0,1 1,-76 0"/>
              <path android:fillColor="#00000000" android:strokeColor="#5B4BD6" android:strokeWidth="3"
                  android:pathData="M54,54m-28,0a28,28 0,1 1,56 0a28,28 0,1 1,-56 0"/>
              <path android:fillColor="#00000000" android:strokeColor="#7B6FE6" android:strokeWidth="2"
                  android:pathData="M54,54m-18,0a18,18 0,1 1,36 0a18,18 0,1 1,-36 0"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M42,44h8v16h-8z M43,45h6v14h-6z M45,58h2v1h-2z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M56,42h10v20h-10z M57,43h8v18h-8z M60,61h2v1h-2z"/>
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="1.5"
                  android:pathData="M50,52 Q54,48 58,52"/>
          </vector>
          XML

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          XML

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          echo "✅ App icon created"

      - name: Build app
        run: |
          echo "🔨 Building app..."
          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew :app:assembleDebug --stacktrace
          else
              gradle :app:assembleDebug --stacktrace
          fi

      - name: Package ZIP
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          ZIP="LinkDeck_v${V}_build${B}_${D}.zip"
          mkdir -p out
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
              echo "❌ No APK found!"
              exit 1
          fi
          cp "$APK" out/LinkDeck.apk
          cat > out/BFB.txt << 'BFB'
          ═══════════════════════════════════════════════════
          BFB.AI - Built For Benefits, by AI
          ═══════════════════════════════════════════════════
          Name:    LinkDeck
          Version: VERSION_PLACEHOLDER
          Build:   BUILD_PLACEHOLDER
          Date:    DATE_PLACEHOLDER
          Phase:   2 - App Icon Only
          ═══════════════════════════════════════════════════
          BFB
          sed -i "s/VERSION_PLACEHOLDER/$V/" out/BFB.txt
          sed -i "s/BUILD_PLACEHOLDER/#$B/" out/BFB.txt
          sed -i "s/DATE_PLACEHOLDER/$D/" out/BFB.txt
          cd out && zip -r "../$ZIP" . && cd ..
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})
          body: |
            ## 🎨 Phase 2 - App Icon Only
            **Built with BFB.AI - Built For Benefits, by AI**
            
            ### What's New
            - ✅ New adaptive app icon (concentric rings design)
            
            SHA256: $(cat ${{ env.ZIP_NAME }}.sha256 | cut -d' ' -f1)
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
