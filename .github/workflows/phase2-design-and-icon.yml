name: Phase 2 - Design System & App Icon

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.1.0'
      build_number:
        description: 'Build number'
        required: true
        default: '002'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Create App Icon (Adaptive Icon)
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable

          # Background color (DarkBackground #0E0B1F)
          cat > app/src/main/res/drawable/ic_launcher_background.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0E0B1F"/>
          </shape>
          XML

          # Foreground (concentric rings + phone/tablet icon)
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Outer ring (LinkColor #B9AFFF) -->
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#B9AFFF"
                  android:strokeWidth="2"
                  android:pathData="M54,54m-38,0a38,38 0,1 1,76 0a38,38 0,1 1,-76 0"/>
              <!-- Middle ring (Primary #5B4BD6) -->
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#5B4BD6"
                  android:strokeWidth="3"
                  android:pathData="M54,54m-28,0a28,28 0,1 1,56 0a28,28 0,1 1,-56 0"/>
              <!-- Inner ring glow -->
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#7B6FE6"
                  android:strokeWidth="2"
                  android:pathData="M54,54m-18,0a18,18 0,1 1,36 0a18,18 0,1 1,-36 0"/>
              <!-- Phone icon (left) -->
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M42,44h8v16h-8z M43,45h6v14h-6z M45,58h2v1h-2z"/>
              <!-- Tablet icon (right) -->
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M56,42h10v20h-10z M57,43h8v18h-8z M60,61h2v1h-2z"/>
              <!-- Connection arc -->
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="1.5"
                  android:pathData="M50,52 Q54,48 58,52"/>
          </vector>
          XML

          # Adaptive icon config
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          XML

          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          echo "✅ App icon created"

      - name: Update AndroidManifest with new icon
        run: |
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher"/g' app/src/main/AndroidManifest.xml
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@mipmap\/ic_launcher_round"/g' app/src/main/AndroidManifest.xml
          # Add if not present
          grep -q 'android:icon=' app/src/main/AndroidManifest.xml || sed -i 's/<application/<application android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher_round"/' app/src/main/AndroidManifest.xml
          echo "✅ Manifest updated"

      - name: Create full DesignTokens.kt
        run: |
          mkdir -p core-design/src/main/java/com/linkdeck/core/design
          cat > core-design/src/main/java/com/linkdeck/core/design/DesignTokens.kt << 'KT'
          package com.linkdeck.core.design
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          object DesignTokens {
              // Dark Theme
              val DarkBackground = Color(0xFF0E0B1F)
              val DarkSurface = Color(0xFF1A1633)
              val DarkRail = Color(0xFF141026)
              val DarkBorder = Color(0xFF2B2650)
              val DarkTile = Color(0xFF2A2455)
              val DarkTileIcon = Color(0xFFC9C2FF)
              
              // Light Theme
              val LightBackground = Color(0xFFF8F7F3)
              val LightSurface = Color(0xFFEFEDE6)
              val LightBorder = Color(0xFFD8D6CC)
              val LightTile = Color(0xFFE4E0F7)
              val LightTileIcon = Color(0xFF4A3FB8)
              
              // Common
              val Primary = Color(0xFF5B4BD6)
              val MiddleRingColor = Color(0xFF4A4290)
              val DangerBg = Color(0xFF3A1212)
              val DangerText = Color(0xFFF87171)
              val LinkColor = Color(0xFFB9AFFF)
              
              // Text
              val TextPrimaryDark = Color(0xFFEDEBFF)
              val TextSecondaryDark = Color(0xFFA9A4CF)
              val TextPrimaryLight = Color(0xFF1B1C1A)
              val TextSecondaryLight = Color(0xFF44463F)
              
              // Status
              val SuccessBg = Color(0xFF12322E)
              val SuccessText = Color(0xFF5EEAD4)
              val WarningBg = Color(0xFF3A2A10)
              val WarningText = Color(0xFFFBBF24)
              
              // Typography
              val TitleFontSize = 26.sp
              val SectionTitleFontSize = 20.sp
              val ItemNameFontSize = 15.sp
              val BodyFontSize = 13.sp
              val ChipFontSize = 12.sp
              val LabelFontSize = 11.sp
              
              // Shapes & Spacing
              val CardRadius = 24.dp
              val TileRadius = 15.dp
              val TileSize = 44.dp
              val ButtonHeight = 48.dp
              val ScreenPadding = 22.dp
              val CardPadding = 16.dp
              val GapBetweenCards = 14.dp
          }
          KT
          echo "✅ DesignTokens.kt created"

      - name: Create Theme.kt
        run: |
          mkdir -p core-design/src/main/java/com/linkdeck/core/design/theme
          cat > core-design/src/main/java/com/linkdeck/core/design/theme/Theme.kt << 'KT'
          package com.linkdeck.core.design.theme

          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Typography
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp
          import com.linkdeck.core.design.DesignTokens

          private val DarkColors = darkColorScheme(
              background = DesignTokens.DarkBackground,
              surface = DesignTokens.DarkSurface,
              surfaceVariant = DesignTokens.DarkRail,
              primary = DesignTokens.Primary,
              onPrimary = Color.White,
              onBackground = DesignTokens.TextPrimaryDark,
              onSurface = DesignTokens.TextPrimaryDark,
              onSurfaceVariant = DesignTokens.TextSecondaryDark,
              outline = DesignTokens.DarkBorder
          )

          private val LightColors = lightColorScheme(
              background = DesignTokens.LightBackground,
              surface = DesignTokens.LightSurface,
              surfaceVariant = DesignTokens.LightSurface,
              primary = DesignTokens.Primary,
              onPrimary = Color.White,
              onBackground = DesignTokens.TextPrimaryLight,
              onSurface = DesignTokens.TextPrimaryLight,
              onSurfaceVariant = DesignTokens.TextSecondaryLight,
              outline = DesignTokens.LightBorder
          )

          val AppTypography = Typography(
              displayLarge = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.ExtraBold, fontSize = 34.sp, lineHeight = 40.sp),
              headlineLarge = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Bold, fontSize = 26.sp, lineHeight = 32.sp),
              headlineMedium = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Bold, fontSize = 20.sp, lineHeight = 26.sp),
              titleLarge = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Bold, fontSize = 18.sp, lineHeight = 24.sp),
              titleMedium = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Medium, fontSize = 15.sp, lineHeight = 22.sp),
              bodyLarge = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Normal, fontSize = 15.sp, lineHeight = 22.sp),
              bodyMedium = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Normal, fontSize = 13.sp, lineHeight = 20.sp),
              bodySmall = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Light, fontSize = 12.sp, lineHeight = 18.sp),
              labelLarge = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Medium, fontSize = 13.sp, lineHeight = 18.sp),
              labelMedium = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Medium, fontSize = 12.sp, lineHeight = 16.sp),
              labelSmall = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Medium, fontSize = 11.sp, lineHeight = 14.sp)
          )

          @Composable
          fun LinkDeckTheme(
              darkTheme: Boolean = isSystemInDarkTheme(),
              content: @Composable () -> Unit
          ) {
              val colorScheme = if (darkTheme) DarkColors else LightColors
              MaterialTheme(
                  colorScheme = colorScheme,
                  typography = AppTypography,
                  content = content
              )
          }
          KT
          echo "✅ Theme.kt created"

      - name: Create Components.kt
        run: |
          mkdir -p core-design/src/main/java/com/linkdeck/core/design/components
          cat > core-design/src/main/java/com/linkdeck/core/design/components/Components.kt << 'KT'
          package com.linkdeck.core.design.components

          import androidx.compose.animation.core.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.unit.dp
          import com.linkdeck.core.design.DesignTokens

          @Composable
          fun LinkDeckCard(modifier: Modifier = Modifier, content: @Composable ColumnScope.() -> Unit) {
              Card(
                  modifier = modifier.fillMaxWidth().border(1.dp, MaterialTheme.colorScheme.outline, RoundedCornerShape(DesignTokens.CardRadius)),
                  shape = RoundedCornerShape(DesignTokens.CardRadius),
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                  elevation = CardDefaults.cardElevation(defaultElevation = 0.dp)
              ) {
                  Column(modifier = Modifier.padding(DesignTokens.CardPadding.dp), content = content)
              }
          }

          @Composable
          fun IconTile(icon: ImageVector, modifier: Modifier = Modifier, tint: Color = MaterialTheme.colorScheme.primary, backgroundColor: Color = MaterialTheme.colorScheme.surfaceVariant, size: Int = 44, contentDescription: String? = null) {
              Box(modifier = modifier.size(size.dp).clip(RoundedCornerShape(DesignTokens.TileRadius)).background(backgroundColor), contentAlignment = Alignment.Center) {
                  Icon(imageVector = icon, contentDescription = contentDescription, tint = tint, modifier = Modifier.size(22.dp))
              }
          }

          enum class ChipVariant { Success, Warning, Danger }

          @Composable
          fun StatusChip(text: String, variant: ChipVariant, modifier: Modifier = Modifier) {
              val (bg, textColor) = when (variant) {
                  ChipVariant.Success -> DesignTokens.SuccessBg to DesignTokens.SuccessText
                  ChipVariant.Warning -> DesignTokens.WarningBg to DesignTokens.WarningText
                  ChipVariant.Danger -> DesignTokens.DangerBg to DesignTokens.DangerText
              }
              Surface(modifier = modifier, shape = RoundedCornerShape(50), color = bg) {
                  Text(text = text, modifier = Modifier.padding(horizontal = 14.dp, vertical = 6.dp), style = MaterialTheme.typography.labelMedium, color = textColor)
              }
          }

          enum class ButtonVariant { Primary, Outlined }

          @Composable
          fun PillButton(text: String, onClick: () -> Unit, modifier: Modifier = Modifier, variant: ButtonVariant = ButtonVariant.Primary, enabled: Boolean = true) {
              when (variant) {
                  ButtonVariant.Primary -> {
                      Button(onClick = onClick, modifier = modifier.fillMaxWidth().height(DesignTokens.ButtonHeight), enabled = enabled, shape = RoundedCornerShape(50), colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.primary, contentColor = Color.White)) {
                          Text(text, style = MaterialTheme.typography.titleMedium)
                      }
                  }
                  ButtonVariant.Outlined -> {
                      OutlinedButton(onClick = onClick, modifier = modifier.fillMaxWidth().height(DesignTokens.ButtonHeight), enabled = enabled, shape = RoundedCornerShape(50), colors = ButtonDefaults.outlinedButtonColors(contentColor = MaterialTheme.colorScheme.onBackground)) {
                          Text(text, style = MaterialTheme.typography.titleMedium)
                      }
                  }
              }
          }

          @Composable
          fun ConnectionOrb(icon: ImageVector, isConnected: Boolean, modifier: Modifier = Modifier) {
              val infiniteTransition = rememberInfiniteTransition(label = "orb")
              val scale by infiniteTransition.animateFloat(initialValue = 1f, targetValue = if (isConnected) 1.03f else 1f, animationSpec = infiniteRepeatable(animation = tween(2000, easing = CubicBezierEasing(0.37f, 0f, 0.63f, 1f)), repeatMode = RepeatMode.Reverse), label = "scale")
              Box(modifier = modifier.size(230.dp), contentAlignment = Alignment.Center) {
                  Box(modifier = Modifier.size(230.dp).border(1.dp, MaterialTheme.colorScheme.outline, CircleShape))
                  Box(modifier = Modifier.size(176.dp).border(1.dp, DesignTokens.MiddleRingColor, CircleShape))
                  Box(modifier = Modifier.size(118.dp).scale(scale).background(MaterialTheme.colorScheme.primary, CircleShape), contentAlignment = Alignment.Center) {
                      Icon(imageVector = icon, contentDescription = null, tint = Color.White, modifier = Modifier.size(48.dp))
                  }
              }
          }
          KT
          echo "✅ Components.kt created"

      - name: Build app
        run: |
          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew :app:assembleDebug --stacktrace
          else
              gradle :app:assembleDebug --stacktrace
          fi

      - name: Package ZIP
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          ZIP="LinkDeck_v${V}_build${B}_${D}.zip"
          mkdir -p out
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
              echo "❌ No APK found!"
              exit 1
          fi
          cp "$APK" out/LinkDeck.apk
          cat > out/BFB.txt << 'BFB'
          ═══════════════════════════════════════════════════
          BFB.AI - Built For Benefits, by AI
          ═══════════════════════════════════════════════════
          Name:    LinkDeck
          Version: VERSION_PLACEHOLDER
          Build:   BUILD_PLACEHOLDER
          Date:    DATE_PLACEHOLDER
          Phase:   2 - Design System & App Icon
          ═══════════════════════════════════════════════════
          BFB
          sed -i "s/VERSION_PLACEHOLDER/$V/" out/BFB.txt
          sed -i "s/BUILD_PLACEHOLDER/#$B/" out/BFB.txt
          sed -i "s/DATE_PLACEHOLDER/$D/" out/BFB.txt
          cd out && zip -r "../$ZIP" . && cd ..
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})
          body: |
            ## 🎨 Phase 2 - Design System & App Icon
            
            **Built with BFB.AI - Built For Benefits, by AI**
            
            ### What's New
            - ✅ New adaptive app icon (concentric rings design)
            - ✅ Full DesignTokens system
            - ✅ Dark/Light theme support
            - ✅ Reusable UI components
            
            SHA256: $(cat ${{ env.ZIP_NAME }}.sha256 | cut -d' ' -f1)
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
