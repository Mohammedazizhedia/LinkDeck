name: Phase 1 - Design System & Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      build_number:
        description: 'Build number (e.g., 001)'
        required: true
        default: '001'

jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Move fonts to correct location
        run: |
          echo "📦 Moving fonts..."
          mkdir -p core-design/src/main/res/font
          
          fonts=("cairo_variable.ttf" "readexpro_variable.ttf" "anton_regular.ttf" "montserrat_variable.ttf" "montserrat_italic_variable.ttf" "roboto_variable.ttf" "roboto_italic_variable.ttf")
          
          for font in "${fonts[@]}"; do
            if [ -f "$font" ]; then
              mv "$font" "core-design/src/main/res/font/"
              echo "✅ Moved: $font"
            else
              echo "⚠️ Not found: $font"
            fi
          done
          
          echo "Fonts in place:"
          ls -la core-design/src/main/res/font/
      
      - name: Create DesignTokens.kt
        run: |
          cat > core-design/src/main/java/com/linkdeck/core/design/DesignTokens.kt << 'EOF'
          // Built with BFB.AI — Built For Benefits, by AI
          package com.linkdeck.core.design

          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          object DesignTokens {
              // Dark Theme
              val DarkBackground = Color(0xFF0E0B1F)
              val DarkSurface = Color(0xFF1A1633)
              val DarkRail = Color(0xFF141026)
              val DarkBorder = Color(0xFF2B2650)
              val DarkTile = Color(0xFF2A2455)
              val DarkTileIcon = Color(0xFFC9C2FF)
              
              // Light Theme
              val LightBackground = Color(0xFFF8F7F3)
              val LightSurface = Color(0xFFEFEDE6)
              val LightBorder = Color(0xFFD8D6CC)
              val LightTile = Color(0xFFE4E0F7)
              val LightTileIcon = Color(0xFF4A3FB8)
              
              // Common
              val Primary = Color(0xFF5B4BD6)
              val MiddleRingColor = Color(0xFF4A4290)
              val DangerBg = Color(0xFF3A1212)
              val DangerText = Color(0xFFF87171)
              val LinkColor = Color(0xFFB9AFFF)
              
              // Text Colors
              val TextPrimaryDark = Color(0xFFEDEBFF)
              val TextSecondaryDark = Color(0xFFA9A4CF)
              val TextPrimaryLight = Color(0xFF1B1C1A)
              val TextSecondaryLight = Color(0xFF44463F)
              
              // Status Colors
              val SuccessBg = Color(0xFF12322E)
              val SuccessText = Color(0xFF5EEAD4)
              val WarningBg = Color(0xFF3A2A10)
              val WarningText = Color(0xFFFBBF24)
              
              // Typography
              val TitleFontSize = 26.sp
              val SectionTitleFontSize = 20.sp
              val ItemNameFontSize = 15.sp
              val BodyFontSize = 13.sp
              val ChipFontSize = 12.sp
              val LabelFontSize = 11.sp
              
              // Shapes & Spacing
              val CardRadius = 24.dp
              val TileRadius = 15.dp
              val TileSize = 44.dp
              val ButtonHeight = 48.dp
              val ScreenPadding = 22.dp
              val CardPadding = 16.dp
              val GapBetweenCards = 14.dp
          }
          EOF
          echo "✅ Created DesignTokens.kt"
      
      - name: Create Theme.kt
        run: |
          cat > core-design/src/main/java/com/linkdeck/core/design/theme/Theme.kt << 'EOF'
          // Built with BFB.AI — Built For Benefits, by AI
          package com.linkdeck.core.design.theme

          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          import com.linkdeck.core.design.DesignTokens

          private val DarkColorScheme = darkColorScheme(
              background = DesignTokens.DarkBackground,
              surface = DesignTokens.DarkSurface,
              surfaceVariant = DesignTokens.DarkRail,
              primary = DesignTokens.Primary,
              onPrimary = Color.White,
              onBackground = DesignTokens.TextPrimaryDark,
              onSurface = DesignTokens.TextPrimaryDark,
              onSurfaceVariant = DesignTokens.TextSecondaryDark,
              outline = DesignTokens.DarkBorder,
              outlineVariant = DesignTokens.DarkBorder
          )

          private val LightColorScheme = lightColorScheme(
              background = DesignTokens.LightBackground,
              surface = DesignTokens.LightSurface,
              surfaceVariant = DesignTokens.LightSurface,
              primary = DesignTokens.Primary,
              onPrimary = Color.White,
              onBackground = DesignTokens.TextPrimaryLight,
              onSurface = DesignTokens.TextPrimaryLight,
              onSurfaceVariant = DesignTokens.TextSecondaryLight,
              outline = DesignTokens.LightBorder,
              outlineVariant = DesignTokens.LightBorder
          )

          @Composable
          fun LinkDeckTheme(
              darkTheme: Boolean = isSystemInDarkTheme(),
              content: @Composable () -> Unit
          ) {
              val colorScheme = if (darkTheme) DarkColorScheme else LightColorScheme

              MaterialTheme(
                  colorScheme = colorScheme,
                  typography = LinkDeckTypography,
                  content = content
              )
          }
          EOF
          echo "✅ Created Theme.kt"
      
      - name: Create Type.kt
        run: |
          cat > core-design/src/main/java/com/linkdeck/core/design/theme/Type.kt << 'EOF'
          // Built with BFB.AI — Built For Benefits, by AI
          package com.linkdeck.core.design.theme

          import androidx.compose.material3.Typography
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.Font
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontVariation
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp
          import com.linkdeck.core.design.R

          val Cairo = FontFamily(
              Font(R.font.cairo_variable, FontWeight.Normal, FontVariation.Settings(FontVariation.weight(400))),
              Font(R.font.cairo_variable, FontWeight.SemiBold, FontVariation.Settings(FontVariation.weight(600))),
              Font(R.font.cairo_variable, FontWeight.Bold, FontVariation.Settings(FontVariation.weight(700))),
              Font(R.font.cairo_variable, FontWeight.ExtraBold, FontVariation.Settings(FontVariation.weight(800)))
          )

          val ReadexPro = FontFamily(
              Font(R.font.readexpro_variable, FontWeight.Light, FontVariation.Settings(FontVariation.weight(300))),
              Font(R.font.readexpro_variable, FontWeight.Normal, FontVariation.Settings(FontVariation.weight(400))),
              Font(R.font.readexpro_variable, FontWeight.Medium, FontVariation.Settings(FontVariation.weight(500))),
              Font(R.font.readexpro_variable, FontWeight.SemiBold, FontVariation.Settings(FontVariation.weight(600)))
          )

          val LinkDeckTypography = Typography(
              displayLarge = TextStyle(fontFamily = Cairo, fontWeight = FontWeight.ExtraBold, fontSize = 34.sp, lineHeight = 40.sp),
              headlineLarge = TextStyle(fontFamily = Cairo, fontWeight = FontWeight.Bold, fontSize = 26.sp, lineHeight = 32.sp),
              headlineMedium = TextStyle(fontFamily = Cairo, fontWeight = FontWeight.Bold, fontSize = 20.sp, lineHeight = 26.sp),
              titleLarge = TextStyle(fontFamily = Cairo, fontWeight = FontWeight.Bold, fontSize = 18.sp, lineHeight = 24.sp),
              titleMedium = TextStyle(fontFamily = ReadexPro, fontWeight = FontWeight.Medium, fontSize = 15.sp, lineHeight = 22.sp),
              bodyLarge = TextStyle(fontFamily = ReadexPro, fontWeight = FontWeight.Normal, fontSize = 15.sp, lineHeight = 22.sp),
              bodyMedium = TextStyle(fontFamily = ReadexPro, fontWeight = FontWeight.Normal, fontSize = 13.sp, lineHeight = 20.sp),
              bodySmall = TextStyle(fontFamily = ReadexPro, fontWeight = FontWeight.Light, fontSize = 12.sp, lineHeight = 18.sp),
              labelLarge = TextStyle(fontFamily = ReadexPro, fontWeight = FontWeight.Medium, fontSize = 13.sp, lineHeight = 18.sp),
              labelMedium = TextStyle(fontFamily = ReadexPro, fontWeight = FontWeight.Medium, fontSize = 12.sp, lineHeight = 16.sp),
              labelSmall = TextStyle(fontFamily = ReadexPro, fontWeight = FontWeight.Medium, fontSize = 11.sp, lineHeight = 14.sp)
          )
          EOF
          echo "✅ Created Type.kt"
      
      - name: Create Components.kt
        run: |
          mkdir -p core-design/src/main/java/com/linkdeck/core/design/components
          cat > core-design/src/main/java/com/linkdeck/core/design/components/Components.kt << 'EOF'
          // Built with BFB.AI — Built For Benefits, by AI
          package com.linkdeck.core.design.components

          import androidx.compose.animation.core.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.blur
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.unit.dp
          import com.linkdeck.core.design.DesignTokens

          @Composable
          fun LinkDeckCard(modifier: Modifier = Modifier, content: @Composable ColumnScope.() -> Unit) {
              Card(
                  modifier = modifier.fillMaxWidth().border(1.dp, MaterialTheme.colorScheme.outline, RoundedCornerShape(DesignTokens.CardRadius)),
                  shape = RoundedCornerShape(DesignTokens.CardRadius),
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                  elevation = CardDefaults.cardElevation(defaultElevation = 0.dp)
              ) {
                  Column(modifier = Modifier.padding(DesignTokens.CardPadding.dp), content = content)
              }
          }

          @Composable
          fun IconTile(icon: ImageVector, modifier: Modifier = Modifier, tint: Color = MaterialTheme.colorScheme.primary, backgroundColor: Color = MaterialTheme.colorScheme.surfaceVariant, size: Int = 44, contentDescription: String? = null) {
              Box(modifier = modifier.size(size.dp).clip(RoundedCornerShape(DesignTokens.TileRadius)).background(backgroundColor), contentAlignment = Alignment.Center) {
                  Icon(imageVector = icon, contentDescription = contentDescription, tint = tint, modifier = Modifier.size(22.dp))
              }
          }

          enum class ChipVariant { Success, Warning, Danger }

          @Composable
          fun StatusChip(text: String, variant: ChipVariant, modifier: Modifier = Modifier) {
              val (bg, textColor) = when (variant) {
                  ChipVariant.Success -> DesignTokens.SuccessBg to DesignTokens.SuccessText
                  ChipVariant.Warning -> DesignTokens.WarningBg to DesignTokens.WarningText
                  ChipVariant.Danger -> DesignTokens.DangerBg to DesignTokens.DangerText
              }
              Surface(modifier = modifier, shape = RoundedCornerShape(50), color = bg) {
                  Text(text = text, modifier = Modifier.padding(horizontal = 14.dp, vertical = 6.dp), style = MaterialTheme.typography.labelMedium, color = textColor)
              }
          }

          enum class ButtonVariant { Primary, Outlined }

          @Composable
          fun PillButton(text: String, onClick: () -> Unit, modifier: Modifier = Modifier, variant: ButtonVariant = ButtonVariant.Primary, enabled: Boolean = true) {
              when (variant) {
                  ButtonVariant.Primary -> {
                      Button(onClick = onClick, modifier = modifier.fillMaxWidth().height(DesignTokens.ButtonHeight), enabled = enabled, shape = RoundedCornerShape(50), colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.primary, contentColor = Color.White)) {
                          Text(text, style = MaterialTheme.typography.titleMedium)
                      }
                  }
                  ButtonVariant.Outlined -> {
                      OutlinedButton(onClick = onClick, modifier = modifier.fillMaxWidth().height(DesignTokens.ButtonHeight), enabled = enabled, shape = RoundedCornerShape(50), colors = ButtonDefaults.outlinedButtonColors(contentColor = MaterialTheme.colorScheme.onBackground)) {
                          Text(text, style = MaterialTheme.typography.titleMedium)
                      }
                  }
              }
          }

          @Composable
          fun ConnectionOrb(icon: ImageVector, isConnected: Boolean, modifier: Modifier = Modifier) {
              val infiniteTransition = rememberInfiniteTransition(label = "orb")
              val scale by infiniteTransition.animateFloat(initialValue = 1f, targetValue = if (isConnected) 1.03f else 1f, animationSpec = infiniteRepeatable(animation = tween(2000, easing = EaseInOutSine), repeatMode = RepeatMode.Reverse), label = "scale")

              Box(modifier = modifier.size(230.dp), contentAlignment = Alignment.Center) {
                  Box(modifier = Modifier.size(230.dp).border(1.dp, MaterialTheme.colorScheme.outline, CircleShape))
                  Box(modifier = Modifier.size(176.dp).border(1.dp, DesignTokens.MiddleRingColor, CircleShape))
                  Box(modifier = Modifier.size(118.dp).scale(scale).background(MaterialTheme.colorScheme.primary, CircleShape), contentAlignment = Alignment.Center) {
                      Icon(imageVector = icon, contentDescription = null, tint = Color.White, modifier = Modifier.size(48.dp))
                  }
              }
          }

          private val EaseInOutSine: Easing = CubicBezierEasing(0.37f, 0f, 0.63f, 1f)
          EOF
          echo "✅ Created Components.kt"
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission
        run: chmod +x gradlew
      
      - name: Build core-design module only
        run: |
          echo "🔨 Building core-design module..."
          ./gradlew :core-design:assembleDebug --stacktrace
          
          if [ $? -eq 0 ]; then
              echo "✅ core-design build successful!"
          else
              echo "❌ core-design build failed!"
              exit 1
          fi
      
      - name: Set version variables
        id: vars
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BUILD="${{ github.event.inputs.build_number }}"
          DATE=$(date +%Y%m%d)
          ZIP_NAME="LinkDeck_v${VERSION}_build${BUILD}_${DATE}.zip"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
      
      - name: Create BFB.txt
        run: |
          cat > BFB.txt << 'EOF'
          ═══════════════════════════════════════════════════════════════════
          BFB.AI
          Built For Benefits, by AI
          ═══════════════════════════════════════════════════════════════════
          
          Name:    LinkDeck
          Version: ${{ steps.vars.outputs.version }}
          Build:   #${{ steps.vars.outputs.build }}
          Date:    ${{ steps.vars.outputs.date }}
          
          Google Services Mode: A (Open - No GMS)
          Typography: Cairo (Headings) + Readex Pro (Body)
          Languages: Arabic (RTL) + English (LTR)
          
          ═══════════════════════════════════════════════════════════════════
          Built with BFB.AI — Built For Benefits, by AI
          ═══════════════════════════════════════════════════════════════════
          EOF
      
      - name: Create ZIP package
        run: |
          ZIP_NAME="${{ steps.vars.outputs.zip_name }}"
          
          mkdir -p LinkDeck_Release
          cp BFB.txt LinkDeck_Release/
          cp README.md LinkDeck_Release/ 2>/dev/null || true
          
          cd LinkDeck_Release
          zip -r "../$ZIP_NAME" .
          cd ..
          
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"
          
          echo "✅ Created: $ZIP_NAME"
          echo "📦 SHA256: $(cat ${ZIP_NAME}.sha256)"
      
      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.zip_name }}
          path: |
            ${{ steps.vars.outputs.zip_name }}
            ${{ steps.vars.outputs.zip_name }}.sha256
          retention-days: 90
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.vars.outputs.version }}-build${{ steps.vars.outputs.build }}
          name: "LinkDeck v${{ steps.vars.outputs.version }} (Build #${{ steps.vars.outputs.build }})"
          body: |
            ## 🎉 LinkDeck v${{ steps.vars.outputs.version }}
            
            **Built with BFB.AI — Built For Benefits, by AI**
            
            ### 📦 What's Included
            - ✅ BFB.txt (version info)
            - ✅ README.md
            - ✅ SHA256 checksum
            
            ### 🔐 Security
            - No Google Play Services (100% offline)
            - TLS 1.3 with certificate pinning
            
            ### 📋 SHA256
            ```
            $(cat ${{ steps.vars.outputs.zip_name }}.sha256)
            ```
            
            ---
            **Built with BFB.AI · Built For Benefits, by AI**
          files: |
            ${{ steps.vars.outputs.zip_name }}
            ${{ steps.vars.outputs.zip_name }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
