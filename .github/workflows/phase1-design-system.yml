name: Phase 1 - Design System & Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.0.0'
      build_number:
        description: 'Build number'
        required: true
        default: '001'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH
          /opt/gradle/bin/gradle -v

      - name: Move fonts to core-design
        run: |
          mkdir -p core-design/src/main/res/font
          for f in cairo_variable.ttf readexpro_variable.ttf anton_regular.ttf montserrat_variable.ttf montserrat_italic_variable.ttf roboto_variable.ttf roboto_italic_variable.ttf; do
            [ -f "$f" ] && mv "$f" core-design/src/main/res/font/ && echo "moved $f"
          done
          ls -la core-design/src/main/res/font/ || true

      - name: Fix settings includes
        run: |
          grep -q '":app"' settings.gradle.kts || echo 'include(":app")' >> settings.gradle.kts
          grep -q '":core-design"' settings.gradle.kts || echo 'include(":core-design")' >> settings.gradle.kts
          grep -q '":core-network"' settings.gradle.kts || echo 'include(":core-network")' >> settings.gradle.kts
          cat settings.gradle.kts

      - name: Update root build.gradle.kts with Compose plugin
        run: |
          cat > build.gradle.kts << 'GRADLE'
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "2.0.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.0" apply false
          }
          GRADLE
          cat build.gradle.kts

      - name: Reset core-design sources
        run: |
          rm -rf core-design/src/main/java
          mkdir -p core-design/src/main/java/com/linkdeck/core/design/theme
          mkdir -p core-design/src/main/java/com/linkdeck/core/design/components

      - name: Write core-design build.gradle.kts with Compose plugin
        run: |
          cat > core-design/build.gradle.kts << 'GRADLE'
          plugins {
              id("com.android.library")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.linkdeck.core.design"
              compileSdk = 34
              defaultConfig { minSdk = 26 }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.compose.ui:ui:1.6.0")
              implementation("androidx.compose.material3:material3:1.2.0")
              implementation("androidx.compose.animation:animation:1.6.0")
          }
          GRADLE

      - name: Write AndroidManifest
        run: |
          cat > core-design/src/main/AndroidManifest.xml << 'MAN'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest />
          MAN

      - name: Write DesignTokens.kt
        run: |
          cat > core-design/src/main/java/com/linkdeck/core/design/DesignTokens.kt << 'KT'
          package com.linkdeck.core.design
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          object DesignTokens {
              val DarkBackground = Color(0xFF0E0B1F)
              val DarkSurface = Color(0xFF1A1633)
              val DarkBorder = Color(0xFF2B2650)
              val LightBackground = Color(0xFFF8F7F3)
              val LightSurface = Color(0xFFEFEDE6)
              val LightBorder = Color(0xFFD8D6CC)
              val Primary = Color(0xFF5B4BD6)
              val SuccessBg = Color(0xFF12322E)
              val SuccessText = Color(0xFF5EEAD4)
              val WarningBg = Color(0xFF3A2A10)
              val WarningText = Color(0xFFFBBF24)
              val DangerBg = Color(0xFF3A1212)
              val DangerText = Color(0xFFF87171)
              val CardRadius = 24.dp
              val TileRadius = 15.dp
              val ButtonHeight = 48.dp
              val ScreenPadding = 22.dp
              val CardPadding = 16.dp
          }
          KT

      - name: Write Theme.kt
        run: |
          cat > core-design/src/main/java/com/linkdeck/core/design/theme/Theme.kt << 'KT'
          package com.linkdeck.core.design.theme
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Typography
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp
          import com.linkdeck.core.design.DesignTokens
          private val DarkColors = darkColorScheme(
              background = DesignTokens.DarkBackground,
              surface = DesignTokens.DarkSurface,
              primary = DesignTokens.Primary,
              onPrimary = Color.White,
              onBackground = Color(0xFFEDEBFF),
              onSurface = Color(0xFFEDEBFF),
              outline = DesignTokens.DarkBorder
          )
          private val LightColors = lightColorScheme(
              background = DesignTokens.LightBackground,
              surface = DesignTokens.LightSurface,
              primary = DesignTokens.Primary,
              onPrimary = Color.White,
              onBackground = Color(0xFF1B1C1A),
              onSurface = Color(0xFF1B1C1A),
              outline = DesignTokens.LightBorder
          )
          val AppTypography = Typography(
              headlineLarge = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Bold, fontSize = 26.sp),
              titleMedium = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Medium, fontSize = 15.sp),
              bodyMedium = TextStyle(fontFamily = FontFamily.Default, fontSize = 13.sp),
              labelSmall = TextStyle(fontFamily = FontFamily.Default, fontSize = 11.sp)
          )
          @Composable
          fun LinkDeckTheme(darkTheme: Boolean = isSystemInDarkTheme(), content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = if (darkTheme) DarkColors else LightColors,
                  typography = AppTypography,
                  content = content
              )
          }
          KT

      - name: Verify Gradle sees modules
        run: |
          gradle -v
          gradle projects

      - name: Build app
        run: gradle :app:assembleDebug --stacktrace

      - name: Package ZIP
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          ZIP="LinkDeck_v${V}_build${B}_${D}.zip"
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/LinkDeck.apk
          echo "Built with BFB.AI - Built For Benefits, by AI" > out/BFB.txt
          cd out && zip -r "../$ZIP" . && cd ..
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})
          body: Built with BFB.AI - Built For Benefits, by AI
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
