name: Phase 1 - Design System & Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.0.0'
      build_number:
        description: 'Build number'
        required: true
        default: '001'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH
          /opt/gradle/bin/gradle -v

      - name: Move fonts to core-design
        run: |
          mkdir -p core-design/src/main/res/font
          for f in cairo_variable.ttf readexpro_variable.ttf anton_regular.ttf montserrat_variable.ttf montserrat_italic_variable.ttf roboto_variable.ttf roboto_italic_variable.ttf; do
            [ -f "$f" ] && mv "$f" core-design/src/main/res/font/ && echo "moved $f"
          done
          echo "Fonts after move:"
          ls -la core-design/src/main/res/font/ || true

      - name: Add DesignTokens.kt (only new file)
        run: |
          mkdir -p core-design/src/main/java/com/linkdeck/core/design
          cat > core-design/src/main/java/com/linkdeck/core/design/DesignTokens.kt << 'KT'
          package com.linkdeck.core.design
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          object DesignTokens {
              val DarkBackground = Color(0xFF0E0B1F)
              val DarkSurface = Color(0xFF1A1633)
              val Primary = Color(0xFF5B4BD6)
              val CardRadius = 24.dp
              val TileRadius = 15.dp
              val ButtonHeight = 48.dp
              val ScreenPadding = 22.dp
              val CardPadding = 16.dp
          }
          KT
          echo "✅ DesignTokens.kt added"

      - name: Build app (using existing config, no modifications)
        run: |
          echo "🔍 Checking existing gradle setup:"
          cat settings.gradle.kts | head -20
          echo ""
          echo "🔨 Building with existing gradle wrapper or system gradle:"
          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew :app:assembleDebug --stacktrace
          else
              gradle :app:assembleDebug --stacktrace
          fi

      - name: Package ZIP
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          ZIP="LinkDeck_v${V}_build${B}_${D}.zip"
          mkdir -p out
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
              echo "❌ No APK found!"
              exit 1
          fi
          cp "$APK" out/LinkDeck.apk
          cat > out/BFB.txt << 'BFB'
          ═══════════════════════════════════════════════════
          BFB.AI - Built For Benefits, by AI
          ═══════════════════════════════════════════════════
          Name:    LinkDeck
          Version: VERSION_PLACEHOLDER
          Build:   BUILD_PLACEHOLDER
          Date:    DATE_PLACEHOLDER
          ═══════════════════════════════════════════════════
          BFB
          sed -i "s/VERSION_PLACEHOLDER/$V/" out/BFB.txt
          sed -i "s/BUILD_PLACEHOLDER/#$B/" out/BFB.txt
          sed -i "s/DATE_PLACEHOLDER/$D/" out/BFB.txt
          cd out && zip -r "../$ZIP" . && cd ..
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV
          ls -lh "$ZIP"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})
          body: |
            Built with BFB.AI - Built For Benefits, by AI
            
            SHA256: $(cat ${{ env.ZIP_NAME }}.sha256 | cut -d' ' -f1)
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
