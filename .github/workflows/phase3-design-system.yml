name: Phase 3 - Design System Components

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.2.0'
      build_number:
        description: 'Build number'
        required: true
        default: '003'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Create LinkDeckTokens.kt (NEW - Safe names)
        run: |
          mkdir -p core-design/src/main/java/com/linkdeck/core/design
          cat > core-design/src/main/java/com/linkdeck/core/design/LinkDeckTokens.kt << 'KT'
          package com.linkdeck.core.design

          import androidx.compose.ui.unit.dp

          object LinkDeckTokens {
              val CardRadius = 24.dp
              val TileRadius = 15.dp
              val ButtonHeight = 48.dp
              val ScreenPadding = 22.dp
              val CardPadding = 16.dp
              val OrbOuterSize = 230.dp
              val OrbMiddleSize = 176.dp
              val OrbInnerSize = 118.dp
          }
          KT
          echo "✅ LinkDeckTokens.kt created"

      - name: Create LinkDeckComponents.kt (NEW - Safe names)
        run: |
          mkdir -p core-design/src/main/java/com/linkdeck/core/design/components
          cat > core-design/src/main/java/com/linkdeck/core/design/components/LinkDeckComponents.kt << 'KT'
          package com.linkdeck.core.design.components

          import androidx.compose.animation.core.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.unit.dp
          import com.linkdeck.core.design.LinkDeckTokens

          @Composable
          fun LinkDeckCard(modifier: Modifier = Modifier, content: @Composable ColumnScope.() -> Unit) {
              Card(
                  modifier = modifier.fillMaxWidth().border(1.dp, MaterialTheme.colorScheme.outline, RoundedCornerShape(LinkDeckTokens.CardRadius)),
                  shape = RoundedCornerShape(LinkDeckTokens.CardRadius),
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                  elevation = CardDefaults.cardElevation(defaultElevation = 0.dp)
              ) {
                  Column(modifier = Modifier.padding(LinkDeckTokens.CardPadding.dp), content = content)
              }
          }

          @Composable
          fun IconTile(icon: ImageVector, modifier: Modifier = Modifier, tint: Color = MaterialTheme.colorScheme.primary, backgroundColor: Color = MaterialTheme.colorScheme.surfaceVariant, size: Int = 44, contentDescription: String? = null) {
              Box(modifier = modifier.size(size.dp).clip(RoundedCornerShape(LinkDeckTokens.TileRadius)).background(backgroundColor), contentAlignment = Alignment.Center) {
                  Icon(imageVector = icon, contentDescription = contentDescription, tint = tint, modifier = Modifier.size(22.dp))
              }
          }

          enum class LinkDeckChipVariant { Success, Warning, Danger }

          @Composable
          fun LinkDeckStatusChip(text: String, variant: LinkDeckChipVariant, modifier: Modifier = Modifier) {
              val (bg, textColor) = when (variant) {
                  LinkDeckChipVariant.Success -> Color(0xFF12322E) to Color(0xFF5EEAD4)
                  LinkDeckChipVariant.Warning -> Color(0xFF3A2A10) to Color(0xFFFBBF24)
                  LinkDeckChipVariant.Danger -> Color(0xFF3A1212) to Color(0xFFF87171)
              }
              Surface(modifier = modifier, shape = RoundedCornerShape(50), color = bg) {
                  Text(text = text, modifier = Modifier.padding(horizontal = 14.dp, vertical = 6.dp), style = MaterialTheme.typography.labelMedium, color = textColor)
              }
          }

          enum class LinkDeckButtonVariant { Primary, Outlined }

          @Composable
          fun LinkDeckPillButton(text: String, onClick: () -> Unit, modifier: Modifier = Modifier, variant: LinkDeckButtonVariant = LinkDeckButtonVariant.Primary, enabled: Boolean = true) {
              when (variant) {
                  LinkDeckButtonVariant.Primary -> {
                      Button(onClick = onClick, modifier = modifier.fillMaxWidth().height(LinkDeckTokens.ButtonHeight), enabled = enabled, shape = RoundedCornerShape(50), colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.primary, contentColor = Color.White)) {
                          Text(text, style = MaterialTheme.typography.titleMedium)
                      }
                  }
                  LinkDeckButtonVariant.Outlined -> {
                      OutlinedButton(onClick = onClick, modifier = modifier.fillMaxWidth().height(LinkDeckTokens.ButtonHeight), enabled = enabled, shape = RoundedCornerShape(50), colors = ButtonDefaults.outlinedButtonColors(contentColor = MaterialTheme.colorScheme.onBackground)) {
                          Text(text, style = MaterialTheme.typography.titleMedium)
                      }
                  }
              }
          }

          @Composable
          fun LinkDeckConnectionOrb(icon: ImageVector, isConnected: Boolean, modifier: Modifier = Modifier) {
              val infiniteTransition = rememberInfiniteTransition(label = "orb")
              val scale by infiniteTransition.animateFloat(initialValue = 1f, targetValue = if (isConnected) 1.03f else 1f, animationSpec = infiniteRepeatable(animation = tween(2000, easing = CubicBezierEasing(0.37f, 0f, 0.63f, 1f)), repeatMode = RepeatMode.Reverse), label = "scale")
              Box(modifier = modifier.size(LinkDeckTokens.OrbOuterSize), contentAlignment = Alignment.Center) {
                  Box(modifier = Modifier.size(LinkDeckTokens.OrbOuterSize).border(1.dp, MaterialTheme.colorScheme.outline, CircleShape))
                  Box(modifier = Modifier.size(LinkDeckTokens.OrbMiddleSize).border(1.dp, Color(0xFF4A4290), CircleShape))
                  Box(modifier = Modifier.size(LinkDeckTokens.OrbInnerSize).scale(scale).background(MaterialTheme.colorScheme.primary, CircleShape), contentAlignment = Alignment.Center) {
                      Icon(imageVector = icon, contentDescription = null, tint = Color.White, modifier = Modifier.size(48.dp))
                  }
              }
          }
          KT
          echo "✅ LinkDeckComponents.kt created"

      - name: Build app
        run: |
          echo "🔨 Building app with new design system..."
          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew :app:assembleDebug --stacktrace
          else
              gradle :app:assembleDebug --stacktrace
          fi

      - name: Package ZIP
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          ZIP="LinkDeck_v${V}_build${B}_${D}.zip"
          mkdir -p out
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
              echo "❌ No APK found!"
              exit 1
          fi
          cp "$APK" out/LinkDeck.apk
          cat > out/BFB.txt << 'BFB'
          ═══════════════════════════════════════════════════
          BFB.AI - Built For Benefits, by AI
          ═══════════════════════════════════════════════════
          Name:    LinkDeck
          Version: VERSION_PLACEHOLDER
          Build:   BUILD_PLACEHOLDER
          Date:    DATE_PLACEHOLDER
          Phase:   3 - Design System Components
          ═══════════════════════════════════════════════════
          BFB
          sed -i "s/VERSION_PLACEHOLDER/$V/" out/BFB.txt
          sed -i "s/BUILD_PLACEHOLDER/#$B/" out/BFB.txt
          sed -i "s/DATE_PLACEHOLDER/$D/" out/BFB.txt
          cd out && zip -r "../$ZIP" . && cd ..
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})
          body: |
            ## 🎨 Phase 3 - Design System Components
            **Built with BFB.AI - Built For Benefits, by AI**
            
            ### What's New
            - ✅ LinkDeckTokens (spacing, radii, sizes)
            - ✅ LinkDeckCard (rounded card with border)
            - ✅ IconTile (rounded icon container)
            - ✅ LinkDeckPillButton (Primary & Outlined)
            - ✅ LinkDeckStatusChip (Success, Warning, Danger)
            - ✅ LinkDeckConnectionOrb (animated connection orb)
            
            SHA256: $(cat ${{ env.ZIP_NAME }}.sha256 | cut -d' ' -f1)
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
