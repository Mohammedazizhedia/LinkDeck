name: Phase 15 - Properly Integrate P2P Status

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.12.0'
      build_number:
        description: 'Build number'
        required: true
        default: '016'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Inspect and update HostHomeScreen
        run: |
          echo "📄 Current HostHomeScreen.kt structure:"
          cat app/src/main/java/com/linkdeck/app/ui/home/HostHomeScreen.kt | head -50
          
          python3 << 'PYTHON'
          file_path = "app/src/main/java/com/linkdeck/app/ui/home/HostHomeScreen.kt"
          
          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Check if already updated
          if 'P2pStatusIndicator' in content:
              print("✅ Already has P2pStatusIndicator")
          else:
              # Add imports after package
              import re
              content = re.sub(
                  r'^(package\s+[\w\.]+)',
                  r'\1\n\nimport androidx.compose.foundation.layout.Spacer\nimport androidx.compose.foundation.layout.height\nimport com.linkdeck.app.ui.components.P2pStatusIndicator\nimport com.linkdeck.app.ui.components.P2pState',
                  content,
                  flags=re.MULTILINE
              )
              
              # Try to add after the first Box or Column in the function
              # Pattern: Find the function body start and add status indicator
              pattern = r'(fun HostHomeScreen\([^)]*\)[^{]*\{)'
              match = re.search(pattern, content, re.DOTALL)
              
              if match:
                  # Find the first major layout element after function start
                  func_start = match.end()
                  remaining = content[func_start:]
                  
                  # Look for first Box, Column, or Surface
                  layout_match = re.search(r'(Box|Column|Surface|Row)\s*\([^)]*\)\s*\{', remaining)
                  if layout_match:
                      insert_pos = func_start + layout_match.end()
                      status_code = '''
                      
                          // P2P Status Indicator
                          P2pStatusIndicator(state = P2pState.DISCONNECTED)
                          Spacer(modifier = Modifier.height(16.dp))
                      '''
                      content = content[:insert_pos] + status_code + content[insert_pos:]
                      print("✅ Added P2pStatusIndicator after first layout element")
                  else:
                      print("️ Could not find layout element")
              else:
                  print("⚠️ Could not find function signature")
          
          with open(file_path, 'w', encoding='utf-8') as f:
              f.write(content)
          PYTHON

      - name: Inspect and update ControllerHomeScreen
        run: |
          echo "📄 Current ControllerHomeScreen.kt structure:"
          cat app/src/main/java/com/linkdeck/app/ui/home/ControllerHomeScreen.kt | head -50
          
          python3 << 'PYTHON'
          file_path = "app/src/main/java/com/linkdeck/app/ui/home/ControllerHomeScreen.kt"
          
          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          if 'P2pStatusIndicator' in content:
              print("✅ Already has P2pStatusIndicator")
          else:
              import re
              content = re.sub(
                  r'^(package\s+[\w\.]+)',
                  r'\1\n\nimport androidx.compose.foundation.layout.Spacer\nimport androidx.compose.foundation.layout.height\nimport com.linkdeck.app.ui.components.P2pStatusIndicator\nimport com.linkdeck.app.ui.components.P2pState',
                  content,
                  flags=re.MULTILINE
              )
              
              pattern = r'(fun ControllerHomeScreen\([^)]*\)[^{]*\{)'
              match = re.search(pattern, content, re.DOTALL)
              
              if match:
                  func_start = match.end()
                  remaining = content[func_start:]
                  
                  layout_match = re.search(r'(Box|Column|Surface|Row)\s*\([^)]*\)\s*\{', remaining)
                  if layout_match:
                      insert_pos = func_start + layout_match.end()
                      status_code = '''
                      
                          // P2P Status Indicator
                          P2pStatusIndicator(state = P2pState.DISCONNECTED)
                          Spacer(modifier = Modifier.height(16.dp))
                      '''
                      content = content[:insert_pos] + status_code + content[insert_pos:]
                      print("✅ Added P2pStatusIndicator after first layout element")
                  else:
                      print("⚠️ Could not find layout element")
              else:
                  print("⚠️ Could not find function signature")
          
          with open(file_path, 'w', encoding='utf-8') as f:
              f.write(content)
          PYTHON

      - name: Build app
        run: |
          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew clean :app:assembleDebug
          else
              gradle clean :app:assembleDebug
          fi

      - name: Package ZIP
        run: |
          V="${{ github.event.inputs.version }}"
          B="${{ github.event.inputs.build_number }}"
          D=$(date +%Y%m%d)
          ZIP="LinkDeck_v${V}_build${B}_${D}.zip"
          mkdir -p out
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && echo "❌ No APK!" && exit 1
          cp "$APK" out/LinkDeck.apk
          echo "Built with BFB.AI - Phase 15: P2P Status Integrated" > out/BFB.txt
          cd out && zip -r "../$ZIP" . && cd ..
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}-build${{ github.event.inputs.build_number }}
          name: "LinkDeck v${{ github.event.inputs.version }} (Build #${{ github.event.inputs.build_number }})"
          body: |
            ## 📡 Phase 15 - P2P Status Integration
            **Built with BFB.AI - Built For Benefits, by AI**
            
            ### What's New
            - ✅ Inspected actual screen structure
            - ✅ Added P2P Status Indicator in the correct location
            - ✅ Should now appear at the top of Host and Controller screens
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
