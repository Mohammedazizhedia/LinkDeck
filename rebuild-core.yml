                      val wm = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as android.net.wifi.WifiManager
                      wm.connectionInfo.ssid?.removePrefix("\"")?.removeSuffix("\"") ?: ""
                  }.getOrDefault("")
