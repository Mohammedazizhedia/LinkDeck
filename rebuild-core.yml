                      json.encodeToString(
                          StatusInfo.serializer(),
                          StatusInfo(
                              battery = level,
                              charging = status == 2 || status == 5,
                              storageTotal = storage.first,
                              storageFree = storage.second,
                              wifiSsid = wifi,
